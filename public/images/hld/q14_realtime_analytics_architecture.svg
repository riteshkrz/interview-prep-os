<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1650" viewBox="0 0 2400 1650"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#64748B"/></marker></defs><rect width="2400" height="1650" fill="#F8FAFC"/><text x="1200.0" y="55" font-family="Inter,Arial,sans-serif" font-size="38" fill="#102849" font-weight="800" text-anchor="middle">DESIGN A REAL-TIME ANALYTICS PIPELINE</text><text x="1200.0" y="94" font-family="Inter,Arial,sans-serif" font-size="23" fill="#426083" font-weight="600" text-anchor="middle">Durable Events · Event-Time Windows · Replayable Aggregates</text><rect x="28" y="125" width="2344" height="650" rx="24" fill="#FFFFFF" stroke="#B8D5F5" stroke-width="2"/><rect x="48" y="145" width="480" height="48" rx="12" fill="#E8F2FF" stroke="#D1E5FF"/><text x="68" y="178" font-family="Inter,Arial,sans-serif" font-size="24" fill="#164E9A" font-weight="750" text-anchor="start">1. HIGH-LEVEL ARCHITECTURE</text><rect x="60" y="270" width="250" height="180" rx="18" fill="#F0F7FF" stroke="#3B82F6" stroke-width="2"/><text x="80" y="305" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Event Producers</text><text x="80" y="333" font-family="Inter,Arial,sans-serif" font-size="17" fill="#3B82F6" font-weight="650" text-anchor="start">SDKs / applications</text><text x="80" y="368" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Business events</text><text x="80" y="395" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Stable event ID + event time</text><text x="80" y="422" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Schema version</text><rect x="355" y="270" width="265" height="180" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="375" y="305" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Ingestion API / SDK</text><text x="375" y="333" font-family="Inter,Arial,sans-serif" font-size="17" fill="#2563EB" font-weight="650" text-anchor="start">Validate + publish</text><text x="375" y="368" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Check required fields</text><text x="375" y="395" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Quarantine malformed events</text><text x="375" y="422" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Append to durable stream</text><rect x="665" y="270" width="270" height="180" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="685" y="305" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Kafka Topics</text><text x="685" y="333" font-family="Inter,Arial,sans-serif" font-size="17" fill="#7C3AED" font-weight="650" text-anchor="start">Partitioned event log</text><text x="685" y="368" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Absorb bursts</text><text x="685" y="395" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Replay consumer offsets</text><text x="685" y="422" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Partition for throughput</text><rect x="980" y="245" width="325" height="230" rx="18" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="1000" y="280" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Stream Processor</text><text x="1000" y="308" font-family="Inter,Arial,sans-serif" font-size="17" fill="#16A34A" font-weight="650" text-anchor="start">Stateful processing</text><text x="1000" y="343" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Deduplicate by event ID</text><text x="1000" y="370" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Enrich / normalize events</text><text x="1000" y="397" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Event-time windows + watermarks</text><text x="1000" y="424" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Checkpoint managed state</text><rect x="1350" y="270" width="280" height="180" rx="18" fill="#ECFEFF" stroke="#0891B2" stroke-width="2"/><text x="1370" y="305" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Real-Time OLAP Store</text><text x="1370" y="333" font-family="Inter,Arial,sans-serif" font-size="17" fill="#0891B2" font-weight="650" text-anchor="start">Queryable aggregates</text><text x="1370" y="368" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Idempotent upserts / corrections</text><text x="1370" y="395" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Filter by time and dimensions</text><text x="1370" y="422" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Serve dashboards / APIs</text><rect x="1675" y="270" width="290" height="180" rx="18" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/><text x="1695" y="305" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Dashboard / Reporting API</text><text x="1695" y="333" font-family="Inter,Arial,sans-serif" font-size="17" fill="#EA580C" font-weight="650" text-anchor="start">Near-real-time view</text><text x="1695" y="368" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Counts, sums, rates</text><text x="1695" y="395" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Window start + freshness</text><text x="1695" y="422" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Provisional totals clearly marked</text><rect x="2010" y="240" width="320" height="205" rx="18" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/><text x="2030" y="275" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Raw Event Archive</text><text x="2030" y="303" font-family="Inter,Arial,sans-serif" font-size="17" fill="#D97706" font-weight="650" text-anchor="start">Object storage</text><text x="2030" y="338" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Compressed, time-partitioned data</text><text x="2030" y="365" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Replay + historical reconstruction</text><text x="2030" y="392" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Retention policy</text><line x1="310" y1="355" x2="355" y2="355" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="620" y1="355" x2="665" y2="355" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="935" y1="355" x2="980" y2="355" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="1305" y1="355" x2="1350" y2="355" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="1630" y1="355" x2="1675" y2="355" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><path d="M800 450 L800 505 L2170 505 L2170 445" fill="none" stroke="#D97706" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arr)"/><text x="1490" y="496" font-family="Inter,Arial,sans-serif" font-size="17" fill="#92400E" font-weight="600" text-anchor="middle">parallel raw-event archive</text><rect x="60" y="535" width="700" height="155" rx="18" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/><text x="80" y="570" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Late / duplicate events</text><text x="80" y="598" font-family="Inter,Arial,sans-serif" font-size="17" fill="#EA580C" font-weight="650" text-anchor="start">Explicit correctness policy</text><text x="80" y="633" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Watermarks + allowed lateness determine window finality.</text><text x="80" y="660" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Late arrivals amend aggregates or emit corrections; event time is not a unique key.</text><rect x="800" y="535" width="700" height="155" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="820" y="570" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Replay and reconciliation</text><text x="820" y="598" font-family="Inter,Arial,sans-serif" font-size="17" fill="#7C3AED" font-weight="650" text-anchor="start">Versioned processing job</text><text x="820" y="633" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Replay raw events with updated transformation logic.</text><text x="820" y="660" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Write to a new version, compare outputs, then promote validated results.</text><rect x="1540" y="535" width="790" height="155" rx="18" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="1560" y="570" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Reliability and observability</text><text x="1560" y="598" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64748B" font-weight="650" text-anchor="start">End-to-end pipeline health</text><text x="1560" y="633" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Track consumer lag, processing delay, late-event rate, checkpoint time, failed records and sink throughput.</text><rect x="28" y="805" width="2344" height="810" rx="24" fill="#FFFFFF" stroke="#B8D5F5" stroke-width="2"/><rect x="48" y="825" width="620" height="48" rx="12" fill="#E8F2FF" stroke="#D1E5FF"/><text x="68" y="858" font-family="Inter,Arial,sans-serif" font-size="24" fill="#164E9A" font-weight="750" text-anchor="start">2. EVENT PROCESSING SEQUENCE</text><rect x="60" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="150" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Producer</text><line x1="150" y1="952" x2="150" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="375" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="465" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Ingestion</text><line x1="465" y1="952" x2="465" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="690" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="780" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Kafka</text><line x1="780" y1="952" x2="780" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="1005" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="1095" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Stream Job</text><line x1="1095" y1="952" x2="1095" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="1320" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="1410" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">State / Checkpoint</text><line x1="1410" y1="952" x2="1410" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="1635" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="1725" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">OLAP Sink</text><line x1="1725" y1="952" x2="1725" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="1950" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="2040" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Dashboard</text><line x1="2040" y1="952" x2="2040" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><line x1="150" y1="985" x2="465" y2="985" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="307.5" y="975" font-family="Inter,Arial,sans-serif" font-size="16" fill="#1E40AF" font-weight="600" text-anchor="middle">1. Send event with ID + event timestamp</text><line x1="465" y1="1030" x2="780" y2="1030" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="622.5" y="1020" font-family="Inter,Arial,sans-serif" font-size="16" fill="#1E40AF" font-weight="600" text-anchor="middle">2. Validate schema; publish to partition</text><line x1="780" y1="1075" x2="1095" y2="1075" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="937.5" y="1065" font-family="Inter,Arial,sans-serif" font-size="16" fill="#1E40AF" font-weight="600" text-anchor="middle">3. Consume records in partition order</text><line x1="1095" y1="1120" x2="1410" y2="1120" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="1252.5" y="1110" font-family="Inter,Arial,sans-serif" font-size="16" fill="#1E40AF" font-weight="600" text-anchor="middle">4. Deduplicate, enrich, assign event-time window</text><line x1="1410" y1="1165" x2="1725" y2="1165" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="1567.5" y="1155" font-family="Inter,Arial,sans-serif" font-size="16" fill="#1E40AF" font-weight="600" text-anchor="middle">5. Checkpoint state; write idempotent aggregate</text><line x1="1725" y1="1210" x2="2040" y2="1210" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="1882.5" y="1200" font-family="Inter,Arial,sans-serif" font-size="16" fill="#1E40AF" font-weight="600" text-anchor="middle">6. Query fresh rollups for dashboard</text><line x1="2040" y1="1255" x2="150" y2="1255" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="1095.0" y="1245" font-family="Inter,Arial,sans-serif" font-size="16" fill="#1E40AF" font-weight="600" text-anchor="middle">7. Report window freshness / provisional status</text><rect x="65" y="1310" width="705" height="235" rx="18" fill="#ECFDF5" stroke="#10B981" stroke-width="2"/><text x="85" y="1345" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Duplicate delivery</text><text x="85" y="1373" font-family="Inter,Arial,sans-serif" font-size="17" fill="#10B981" font-weight="650" text-anchor="start">Idempotency</text><text x="85" y="1408" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Stable event ID or idempotent aggregate key</text><text x="85" y="1435" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Replayed events cannot increment the same business effect twice</text><rect x="825" y="1310" width="705" height="235" rx="18" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/><text x="845" y="1345" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Late arrivals</text><text x="845" y="1373" font-family="Inter,Arial,sans-serif" font-size="17" fill="#EA580C" font-weight="650" text-anchor="start">Window correction</text><text x="845" y="1408" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Watermark + allowed-lateness policy</text><text x="845" y="1435" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Amend aggregate or emit a correction event</text><rect x="1585" y="1310" width="745" height="235" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="1605" y="1345" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Failure recovery</text><text x="1605" y="1373" font-family="Inter,Arial,sans-serif" font-size="17" fill="#7C3AED" font-weight="650" text-anchor="start">Checkpoint + replay</text><text x="1605" y="1408" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Restore state from checkpoint; resume Kafka offset</text><text x="1605" y="1435" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Keep raw events for historical reprocessing and reconciliation</text><text x="1200.0" y="1590" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64748B" font-weight="600" text-anchor="middle">Core principle: durable raw events + recoverable state + idempotent sinks = reproducible analytics.</text></svg>