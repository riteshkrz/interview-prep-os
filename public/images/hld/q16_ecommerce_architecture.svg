<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1650" viewBox="0 0 2400 1650"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#64748B"/></marker></defs><rect width="2400" height="1650" fill="#F8FAFC"/><text x="1200.0" y="55" font-family="Inter,Arial,sans-serif" font-size="38" fill="#102849" font-weight="800" text-anchor="middle">DESIGN AN E-COMMERCE PLATFORM</text><text x="1200.0" y="94" font-family="Inter,Arial,sans-serif" font-size="23" fill="#426083" font-weight="600" text-anchor="middle">Catalog · Checkout · Inventory Reservation · Payment · Fulfillment</text><rect x="28" y="125" width="2344" height="650" rx="24" fill="#FFFFFF" stroke="#B8D5F5" stroke-width="2"/><rect x="48" y="145" width="480" height="48" rx="12" fill="#E8F2FF" stroke="#D1E5FF"/><text x="68" y="178" font-family="Inter,Arial,sans-serif" font-size="24" fill="#164E9A" font-weight="750" text-anchor="start">1. HIGH-LEVEL ARCHITECTURE</text><rect x="60" y="270" width="250" height="175" rx="18" fill="#F0F7FF" stroke="#3B82F6" stroke-width="2"/><text x="80" y="305" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Web / Mobile Client</text><text x="80" y="333" font-family="Inter,Arial,sans-serif" font-size="17" fill="#3B82F6" font-weight="650" text-anchor="start">Shopper</text><text x="80" y="368" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Browse / search products</text><text x="80" y="395" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Cart and checkout</text><text x="80" y="422" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Order status / cancellation</text><rect x="355" y="270" width="270" height="175" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="375" y="305" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">API Gateway</text><text x="375" y="333" font-family="Inter,Arial,sans-serif" font-size="17" fill="#2563EB" font-weight="650" text-anchor="start">Cross-cutting policies</text><text x="375" y="368" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Authentication / authorization</text><text x="375" y="395" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Rate limiting and routing</text><text x="375" y="422" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Request IDs / idempotency</text><rect x="670" y="235" width="300" height="200" rx="18" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/><text x="690" y="270" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Catalog &amp; Search</text><text x="690" y="298" font-family="Inter,Arial,sans-serif" font-size="17" fill="#EA580C" font-weight="650" text-anchor="start">Read-optimized path</text><text x="690" y="333" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Product metadata and prices</text><text x="690" y="360" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Search index for discovery</text><text x="690" y="387" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Cache popular product data</text><rect x="670" y="475" width="300" height="160" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="690" y="510" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Cart Service</text><text x="690" y="538" font-family="Inter,Arial,sans-serif" font-size="17" fill="#7C3AED" font-weight="650" text-anchor="start">Shopping intent</text><text x="690" y="573" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Persist cart items</text><text x="690" y="600" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Do not reserve stock by default</text><rect x="1015" y="235" width="320" height="200" rx="18" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="1035" y="270" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Order Service</text><text x="1035" y="298" font-family="Inter,Arial,sans-serif" font-size="17" fill="#16A34A" font-weight="650" text-anchor="start">Purchase lifecycle</text><text x="1035" y="333" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Create pending order</text><text x="1035" y="360" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Idempotency key + price snapshot</text><text x="1035" y="387" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Own order state machine</text><rect x="1015" y="475" width="320" height="160" rx="18" fill="#FFF1F2" stroke="#E11D48" stroke-width="2"/><text x="1035" y="510" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Inventory Service</text><text x="1035" y="538" font-family="Inter,Arial,sans-serif" font-size="17" fill="#E11D48" font-weight="650" text-anchor="start">Authoritative stock</text><text x="1035" y="573" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Conditional reserve / release</text><text x="1035" y="600" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Prevent overselling</text><text x="1035" y="627" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Track available + reserved qty</text><rect x="1380" y="235" width="300" height="200" rx="18" fill="#ECFEFF" stroke="#0891B2" stroke-width="2"/><text x="1400" y="270" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Payment Service</text><text x="1400" y="298" font-family="Inter,Arial,sans-serif" font-size="17" fill="#0891B2" font-weight="650" text-anchor="start">Provider integration</text><text x="1400" y="333" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Authorize / capture payment</text><text x="1400" y="360" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Provider references + callbacks</text><text x="1400" y="387" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Retries and reconciliation</text><rect x="1380" y="475" width="300" height="160" rx="18" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/><text x="1400" y="510" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Payment Provider</text><text x="1400" y="538" font-family="Inter,Arial,sans-serif" font-size="17" fill="#D97706" font-weight="650" text-anchor="start">External system</text><text x="1400" y="573" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Payment result / timeout</text><text x="1400" y="600" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Void or refund as required</text><rect x="1725" y="235" width="270" height="200" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="1745" y="270" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Outbox + Event Bus</text><text x="1745" y="298" font-family="Inter,Arial,sans-serif" font-size="17" fill="#7C3AED" font-weight="650" text-anchor="start">Reliable async work</text><text x="1745" y="333" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Confirmed-order event</text><text x="1745" y="360" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Publish without losing commit</text><text x="1745" y="387" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Replay / idempotent consumers</text><rect x="2040" y="235" width="290" height="200" rx="18" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="2060" y="270" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Fulfillment Services</text><text x="2060" y="298" font-family="Inter,Arial,sans-serif" font-size="17" fill="#16A34A" font-weight="650" text-anchor="start">Downstream work</text><text x="2060" y="333" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Warehouse / shipping partner</text><text x="2060" y="360" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Tracking and order updates</text><text x="2060" y="387" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Notifications</text><rect x="1725" y="475" width="605" height="160" rx="18" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="1745" y="510" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Operational Data Stores</text><text x="1745" y="538" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64748B" font-weight="650" text-anchor="start">Source-of-truth records</text><text x="1745" y="573" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Product DB + search index · Cart store · Order DB</text><text x="1745" y="600" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Inventory DB · Payment records · shipment state</text><line x1="310" y1="355" x2="355" y2="355" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="625" y1="315" x2="670" y2="315" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="625" y1="395" x2="670" y2="540" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="970" y1="315" x2="1015" y2="315" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="970" y1="555" x2="1015" y2="555" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="1160" y1="435" x2="1160" y2="475" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="1335" y1="315" x2="1380" y2="315" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="1530" y1="435" x2="1530" y2="475" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="1335" y1="520" x2="1380" y2="520" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="1680" y1="315" x2="1725" y2="315" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="1995" y1="315" x2="2040" y2="315" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><path d="M1160 635 L1160 690 L2020 690 L2020 435" fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arr)"/><text x="1570" y="681" font-family="Inter,Arial,sans-serif" font-size="16" fill="#475569" font-weight="600" text-anchor="middle">persisted state / event-driven handoff</text><path d="M870 435 L870 690 L900 690 L900 635" fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arr)"/><rect x="60" y="660" width="1610" height="78" rx="18" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/><text x="80" y="695" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Correctness boundaries: checkout revalidates price + stock; inventory changes are atomic; payment/order are reconciled; caches never decide final stock.</text><rect x="28" y="805" width="2344" height="810" rx="24" fill="#FFFFFF" stroke="#B8D5F5" stroke-width="2"/><rect x="48" y="825" width="740" height="48" rx="12" fill="#E8F2FF" stroke="#D1E5FF"/><text x="68" y="858" font-family="Inter,Arial,sans-serif" font-size="24" fill="#164E9A" font-weight="750" text-anchor="start">2. CHECKOUT SEQUENCE &amp; FAILURE COMPENSATION</text><rect x="60" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="150" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Customer</text><line x1="150" y1="952" x2="150" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="375" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="465" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Order Service</text><line x1="465" y1="952" x2="465" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="690" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="780" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Inventory</text><line x1="780" y1="952" x2="780" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="1005" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="1095" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Payment Service</text><line x1="1095" y1="952" x2="1095" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="1320" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="1410" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Provider</text><line x1="1410" y1="952" x2="1410" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="1635" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="1725" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Outbox / Queue</text><line x1="1725" y1="952" x2="1725" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="1950" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="2040" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Fulfillment</text><line x1="2040" y1="952" x2="2040" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><line x1="150" y1="985" x2="465" y2="985" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="307.5" y="975" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">1. POST checkout (idempotency key)</text><line x1="465" y1="1030" x2="780" y2="1030" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="622.5" y="1020" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">2. Validate items; atomically reserve stock</text><line x1="780" y1="1075" x2="465" y2="1075" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="622.5" y="1065" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">3. Return reservation / conflict</text><line x1="465" y1="1120" x2="1095" y2="1120" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="780.0" y="1110" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">4. Create payment request</text><line x1="1095" y1="1165" x2="1410" y2="1165" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="1252.5" y="1155" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">5. Authorize / capture; handle timeout as unknown</text><line x1="1410" y1="1210" x2="1095" y2="1210" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="1252.5" y="1200" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">6. Webhook / query confirms outcome</text><line x1="1095" y1="1255" x2="465" y2="1255" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="780.0" y="1245" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">7. Persist payment result; confirm order or compensate</text><line x1="465" y1="1300" x2="1725" y2="1300" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="1095.0" y="1290" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">8. Outbox publishes confirmed order reliably</text><line x1="1725" y1="1345" x2="2040" y2="1345" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="1882.5" y="1335" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">9. Start fulfillment + notify customer</text><rect x="65" y="1415" width="705" height="135" rx="18" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/><text x="85" y="1450" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Payment fails / times out</text><text x="85" y="1478" font-family="Inter,Arial,sans-serif" font-size="17" fill="#EA580C" font-weight="650" text-anchor="start">Reconcile before retry</text><text x="85" y="1513" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Check provider state; release stock only when safe</text><rect x="825" y="1415" width="705" height="135" rx="18" fill="#FFF1F2" stroke="#E11D48" stroke-width="2"/><text x="845" y="1450" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Reservation / order fails</text><text x="845" y="1478" font-family="Inter,Arial,sans-serif" font-size="17" fill="#E11D48" font-weight="650" text-anchor="start">Compensation</text><text x="845" y="1513" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Release reserved stock; void or refund if needed</text><rect x="1585" y="1415" width="745" height="135" rx="18" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="1605" y="1450" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Flash-sale behavior</text><text x="1605" y="1478" font-family="Inter,Arial,sans-serif" font-size="17" fill="#16A34A" font-weight="650" text-anchor="start">Protect hot inventory</text><text x="1605" y="1513" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Rate limit / queue checkout; conditional writes remain authoritative</text><text x="1200.0" y="1590" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64748B" font-weight="600" text-anchor="middle">Core principle: browse can be eventually consistent; checkout and inventory transitions require authoritative correctness.</text></svg>