<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1320" viewBox="0 0 2000 1320" role="img" aria-labelledby="svgTitle svgDesc">
<title id="svgTitle">Ad Impression Tracking System — Event Processing Sequence</title><desc id="svgDesc">Sequence diagram showing event submission, validation, durable Kafka append, acknowledgment, raw archival, deduplication, metadata lookup, event-time aggregation, idempotent rollup writes, dashboard queries and reconciliation.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
  <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
  <style>
    text { font-family: Inter, Arial, Helvetica, sans-serif; fill: #172033; }
    .main-title { font-size: 36px; font-weight: 750; fill: #102849; letter-spacing: .2px; }
    .subtitle { font-size: 17px; fill: #64748B; }
    .section-title { font-size: 19px; font-weight: 700; fill: #102849; }
    .card-title { font-size: 17px; font-weight: 700; }
    .body { font-size: 14px; }
    .small { font-size: 12px; }
    .tiny { font-size: 11px; }
    .muted { fill: #64748B; }
    .label { font-size: 12px; font-weight: 700; fill: #2563EB; }
    .flow { fill: none; stroke: #2563EB; stroke-width: 2.1; marker-end: url(#arrow); }
    .flow-gray { fill: none; stroke: #64748B; stroke-width: 1.8; marker-end: url(#arrowGray); }
    .dash { stroke-dasharray: 6 5; }
  </style>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="55" y="62" class="main-title">DESIGN AN AD IMPRESSION TRACKING SYSTEM</text><text x="55" y="96" class="subtitle">02  /  EVENT-PROCESSING SEQUENCE</text><rect x="55" y="120" width="1890" height="58" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.2"/><text x="78" y="155" class="body" style="fill:#102849">Core guarantee: return ACCEPTED only after the event has crossed the configured durable-append boundary.</text><rect x="65" y="205" width="205" height="80" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="167.5" y="237" class="card-title" style="fill:#2563EB" text-anchor="middle">Event Producer</text><text x="167.5" y="260" class="small" style="fill:#64748B" text-anchor="middle">Web / App / Ad Server</text><line x1="167.5" y1="285" x2="167.5" y2="1075" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="6 6"/><rect x="300" y="205" width="205" height="80" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="402.5" y="237" class="card-title" style="fill:#2563EB" text-anchor="middle">Ingestion API</text><text x="402.5" y="260" class="small" style="fill:#64748B" text-anchor="middle">Validate + enqueue</text><line x1="402.5" y1="285" x2="402.5" y2="1075" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="6 6"/><rect x="535" y="205" width="195" height="80" rx="12" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.5"/><text x="632.5" y="237" class="card-title" style="fill:#6D28D9" text-anchor="middle">Kafka</text><text x="632.5" y="260" class="small" style="fill:#64748B" text-anchor="middle">Durable topics</text><line x1="632.5" y1="285" x2="632.5" y2="1075" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="6 6"/><rect x="760" y="205" width="220" height="80" rx="12" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.5"/><text x="870.0" y="237" class="card-title" style="fill:#6D28D9" text-anchor="middle">Raw Archive Worker</text><text x="870.0" y="260" class="small" style="fill:#64748B" text-anchor="middle">Batch + persist</text><line x1="870.0" y1="285" x2="870.0" y2="1075" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="6 6"/><rect x="1010" y="205" width="220" height="80" rx="12" fill="#ECFDF5" stroke="#047857" stroke-width="1.5"/><text x="1120.0" y="237" class="card-title" style="fill:#047857" text-anchor="middle">Stream Processor</text><text x="1120.0" y="260" class="small" style="fill:#64748B" text-anchor="middle">Stateful consumers</text><line x1="1120.0" y1="285" x2="1120.0" y2="1075" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="6 6"/><rect x="1260" y="205" width="230" height="80" rx="12" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/><text x="1375.0" y="237" class="card-title" style="fill:#B45309" text-anchor="middle">Metadata Cache / View</text><text x="1375.0" y="260" class="small" style="fill:#64748B" text-anchor="middle">Campaign + creative</text><line x1="1375.0" y1="285" x2="1375.0" y2="1075" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="6 6"/><rect x="1520" y="205" width="195" height="80" rx="12" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.5"/><text x="1617.5" y="237" class="card-title" style="fill:#0F766E" text-anchor="middle">Aggregate Store</text><text x="1617.5" y="260" class="small" style="fill:#64748B" text-anchor="middle">OLAP rollups</text><line x1="1617.5" y1="285" x2="1617.5" y2="1075" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="6 6"/><rect x="1740" y="205" width="205" height="80" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.5"/><text x="1842.5" y="237" class="card-title" style="fill:#2563EB" text-anchor="middle">Dashboard Client/API</text><text x="1842.5" y="260" class="small" style="fill:#64748B" text-anchor="middle">Query results</text><line x1="1842.5" y1="285" x2="1842.5" y2="1075" stroke="#94A3B8" stroke-width="1.4" stroke-dasharray="6 6"/><path d="M167.5,315 L402.5,315" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/><rect x="167.0" y="292" width="236" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="285.0" y="306" class="small" style="fill:#2563EB" text-anchor="middle">1. POST impression batch</text><path d="M402.5,370 L402.5,370" fill="none" stroke="#047857" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrow)"/><rect x="284.5" y="347" width="236" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="402.5" y="361" class="small" style="fill:#047857" text-anchor="middle">2. Validate schema / event ID</text><path d="M402.5,425 L632.5,425" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/><rect x="399.5" y="402" width="236" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="517.5" y="416" class="small" style="fill:#2563EB" text-anchor="middle">3. Append accepted event batch</text><path d="M632.5,480 L402.5,480" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowGray)"/><rect x="399.5" y="457" width="236" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="517.5" y="471" class="small" style="fill:#2563EB" text-anchor="middle">4. Durable append acknowledged</text><path d="M402.5,535 L167.5,535" fill="none" stroke="#2563EB" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowGray)"/><rect x="167.0" y="512" width="236" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="285.0" y="526" class="small" style="fill:#2563EB" text-anchor="middle">5. Return ACCEPTED + request ID</text><path d="M632.5,600 L870.0,600" fill="none" stroke="#6D28D9" stroke-width="2" marker-end="url(#arrow)"/><rect x="633.25" y="577" width="236" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="751.25" y="591" class="small" style="fill:#6D28D9" text-anchor="middle">6. Archive raw events (async)</text><path d="M632.5,655 L1120.0,655" fill="none" stroke="#047857" stroke-width="2" marker-end="url(#arrow)"/><rect x="758.25" y="632" width="236" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="876.25" y="646" class="small" style="fill:#047857" text-anchor="middle">7. Consume partition</text><rect x="955" y="682" width="280" height="58" rx="10" fill="#ECFDF5" stroke="#047857" stroke-width="1.2"/><text x="1095" y="705" class="small" style="fill:#047857" text-anchor="middle">8. Deduplicate by stable eventId</text><text x="1095" y="724" class="small" style="fill:#64748B" text-anchor="middle">Duplicate → no second count</text><path d="M1120.0,765 L1375.0,765" fill="none" stroke="#B45309" stroke-width="2" marker-end="url(#arrow)"/><rect x="1129.5" y="742" width="236" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="1247.5" y="756" class="small" style="fill:#B45309" text-anchor="middle">9. Lookup campaign / creative</text><path d="M1375.0,820 L1120.0,820" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowGray)"/><rect x="1129.5" y="797" width="236" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="1247.5" y="811" class="small" style="fill:#B45309" text-anchor="middle">10. Return metadata or miss</text><rect x="1000" y="842" width="250" height="54" rx="10" fill="#FFFBEB" stroke="#B45309" stroke-width="1.2"/><text x="1125" y="864" class="small" style="fill:#B45309" text-anchor="middle">Miss → retain for later join</text><text x="1125" y="882" class="small" style="fill:#64748B" text-anchor="middle">Do not drop a valid event</text><path d="M1120.0,920 L1617.5,920" fill="none" stroke="#0F766E" stroke-width="2" marker-end="url(#arrow)"/><rect x="1250.75" y="897" width="236" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="1368.75" y="911" class="small" style="fill:#0F766E" text-anchor="middle">11. Idempotent windowed upsert</text><path d="M1842.5,975 L1617.5,975" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#arrow)"/><rect x="1612.0" y="952" width="236" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="1730.0" y="966" class="small" style="fill:#2563EB" text-anchor="middle">12. Query by campaign + time</text><path d="M1617.5,1030 L1842.5,1030" fill="none" stroke="#0F766E" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#arrowGray)"/><rect x="1612.0" y="1007" width="236" height="18" rx="4" fill="#FFFFFF" opacity="0.95"/><text x="1730.0" y="1021" class="small" style="fill:#0F766E" text-anchor="middle">13. Return provisional aggregate</text><rect x="55" y="1100" width="915" height="135" rx="12" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.3"/><text x="78" y="1132" class="card-title" style="fill:#6D28D9">ASYNC RAW-EVENT PATH</text><text x="78" y="1160" class="body">Kafka → archive worker → compressed, time-partitioned object storage.</text><text x="78" y="1188" class="body">The archive enables replay, auditing and batch recomputation.</text><rect x="1000" y="1100" width="945" height="135" rx="12" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.3"/><text x="1023" y="1132" class="card-title" style="fill:#0F766E">RECONCILIATION PATH</text><text x="1023" y="1160" class="body">Batch jobs reread raw events, recompute chosen windows and compare with live rollups.</text><text x="1023" y="1188" class="body">Late events or corrected rules may revise historical totals.</text><text x="55" y="1280" class="small" style="fill:#64748B">Illustrative sequence. Transport and processing guarantees depend on configured durability, checkpointing and sink semantics.</text></svg>