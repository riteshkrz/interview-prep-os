650" text-anchor="start">Kafka / partitioned topics</text><text x="990" y="363" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Absorb traffic spikes</text><text x="990" y="390" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Decouple producers</text><text x="990" y="417" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Replay consumer streams</text><rect x="1275" y="245" width="300" height="220" rx="18" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="1295" y="280" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Processing Pipeline</text><text x="1295" y="308" font-family="Inter,Arial,sans-serif" font-size="17" fill="#16A34A" font-weight="650" text-anchor="start">Normalize / enrich / redact</text><text x="1295" y="343" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Normalize timestamps and schema</text><text x="1295" y="370" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Redact secrets / sensitive fields</text><text x="1295" y="397" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Route by telemetry type</text><text x="1295" y="424" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Aggregate windows / rollups</text><rect x="1620" y="235" width="320" height="145" rx="18" fill="#FFF1F2" stroke="#E11D48" stroke-width="2"/><text x="1640" y="270" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Hot Log Search</text><text x="1640" y="298" font-family="Inter,Arial,sans-serif" font-size="17" fill="#E11D48" font-weight="650" text-anchor="start">Search index</text><text x="1640" y="333" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Recent logs by service / level</text><text x="1640" y="360" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Time-range filtering</text><rect x="1620" y="400" width="320" height="145" rx="18" fill="#ECFEFF" stroke="#0891B2" stroke-width="2"/><text x="1640" y="435" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Metrics &amp; Traces</text><text x="1640" y="463" font-family="Inter,Arial,sans-serif" font-size="17" fill="#0891B2" font-weight="650" text-anchor="start">Specialized stores</text><text x="1640" y="498" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Time-series metrics / percentiles</text><text x="1640" y="525" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Trace spans and service links</text><rect x="1985" y="235" width="345" height="145" rx="18" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/><text x="2005" y="270" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Cold Archive</text><text x="2005" y="298" font-family="Inter,Arial,sans-serif" font-size="17" fill="#D97706" font-weight="650" text-anchor="start">Object storage</text><text x="2005" y="333" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Compressed raw records</text><text x="2005" y="360" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Lifecycle retention tiers</text><rect x="1985" y="400" width="345" height="145" rx="18" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="2005" y="435" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Alert Evaluator</text><text x="2005" y="463" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64748B" font-weight="650" text-anchor="start">Rules + routing</text><text x="2005" y="498" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Threshold / window rules</text><text x="2005" y="525" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Group duplicate alerts</text><line x1="310" y1="350" x2="355" y2="350" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="615" y1="350" x2="660" y2="350" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="925" y1="350" x2="970" y2="350" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="1230" y1="350" x2="1275" y2="350" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><path d="M1575 295 L1600 295 L1600 305 L1620 305" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><path d="M1575 365 L1595 365 L1595 470 L1620 470" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><path d="M1575 330 L1960 330 L1960 305 L1985 305" fill="none" stroke="#64748B" stroke-width="3" stroke-dasharray="8,5" marker-end="url(#arr)"/><path d="M1780 380 L1780 400" fill="none" stroke="#64748B" stroke-width="2" stroke-dasharray="6,5" marker-end="url(#arr)"/><path d="M1940 470 L1985 470" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><rect x="60" y="520" width="1500" height="165" rx="18" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="80" y="555" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Operational safeguards</text><text x="80" y="583" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64748B" font-weight="650" text-anchor="start">Bounded buffering &amp; data governance</text><text x="80" y="618" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Telemetry should not block business requests indefinitely; buffers have explicit disk / memory caps.</text><text x="80" y="645" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Redact secrets before indexing; restrict access and audit reads. Apply retention / deletion to archives too.</text><rect x="60" y="705" width="2270" height="48" rx="18" fill="#E8F2FF" stroke="#93C5FD" stroke-width="2"/><text x="80" y="740" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Key operating signals: ingest rate · consumer lag · search latency · dropped records · cardinality · retention spend · alert delay</text><rect x="28" y="805" width="2344" height="810" rx="24" fill="#FFFFFF" stroke="#B8D5F5" stroke-width="2"/><rect x="48" y="825" width="660" height="48" rx="12" fill="#E8F2FF" stroke="#D1E5FF"/><text x="68" y="858" font-family="Inter,Arial,sans-serif" font-size="24" fill="#164E9A" font-weight="750" text-anchor="start">2. TELEMETRY INGESTION &amp; ALERT SEQUENCE</text><rect x="60" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="150" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Service / Agent</text><line x1="150" y1="952" x2="150" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="375" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="465" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Collector</text><line x1="465" y1="952" x2="465" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="690" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="780" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Gateway</text><line x1="780" y1="952" x2="780" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="1005" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="1095" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Kafka</text><line x1="1095" y1="952" x2="1095" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="1320" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="1410" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Processor</text><line x1="1410" y1="952" x2="1410" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="1635" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="1725" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Stores</text><line x1="1725" y1="952" x2="1725" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="1950" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="2040" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Alert Evaluator</text><line x1="2040" y1="952" x2="2040" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><line x1="150" y1="985" x2="465" y2="985" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="307.5" y="975" font-family="Inter,Arial,sans-serif" font-size="16" fill="#1E40AF" font-weight="600" text-anchor="middle">1. Emit structured event into bounded buffer</text><line x1="465" y1="1030" x2="780" y2="1030" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="622.5" y="1020" font-family="Inter,Arial,sans-serif" font-size="16" fill="#1E40AF" font-weight="600" text-anchor="middle">2. Batch + validate schema / limits</text><line x1="780" y1="1075" x2="1095" y2="1075" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="937.5" y="1065" font-family="Inter,Arial,sans-serif" font-size="16" fill="#1E40AF" font-weight="600" text-anchor="middle">3. Publish accepted record to topic</text><line x1="1095" y1="1120" x2="1410" y2="1120" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="1252.5" y="1110" font-family="Inter,Arial,sans-serif" font-size="16" fill="#1E40AF" font-weight="600" text-anchor="middle">4. Consume, normalize, enrich and redact</text><line x1="1410" y1="1165" x2="1725" y2="1165" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="1567.5" y="1155" font-family="Inter,Arial,sans-serif" font-size="16" fill="#1E40AF" font-weight="600" text-anchor="middle">5. Write hot logs + metric / trace stores</text><line x1="1410" y1="1210" x2="2040" y2="1210" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="1725.0" y="1200" font-family="Inter,Arial,sans-serif" font-size="16" fill="#1E40AF" font-weight="600" text-anchor="middle">6. Evaluate alert rules over windows</text><line x1="2040" y1="1255" x2="150" y2="1255" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="1095.0" y="1245" font-family="Inter,Arial,sans-serif" font-size="16" fill="#1E40AF" font-weight="600" text-anchor="middle">7. Route grouped alert to on-call channel</text><rect x="65" y="1310" width="705" height="235" rx="18" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/><text x="85" y="1345" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Kafka / downstream outage</text><text x="85" y="1373" font-family="Inter,Arial,sans-serif" font-size="17" fill="#EA580C" font-weight="650" text-anchor="start">Defined degraded mode</text><text x="85" y="1408" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Collectors buffer locally within caps</text><text x="85" y="1435" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">When full: sample / drop lower-value telemetry</text><text x="85" y="1462" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Never block a business request indefinitely</text><rect x="825" y="1310" width="705" height="235" rx="18" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="845" y="1345" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Search / metrics backend outage</text><text x="845" y="1373" font-family="Inter,Arial,sans-serif" font-size="17" fill="#16A34A" font-weight="650" text-anchor="start">Protect the ingest path</text><text x="845" y="1408" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Kafka retains backlog within configured retention</text><text x="845" y="1435" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Scale consumers after recovery</text><text x="845" y="1462" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Monitor lag and sink saturation</text><rect x="1585" y="1310" width="745" height="235" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="1605" y="1345" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Cost, privacy &amp; quality controls</text><text x="1605" y="1373" font-family="Inter,Arial,sans-serif" font-size="17" fill="#7C3AED" font-weight="650" text-anchor="start">Retention tiers and observability</text><text x="1605" y="1408" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Selective indexing + compression</text><text x="1605" y="1435" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Limit high-cardinality metric labels</text><text x="1605" y="1462" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Audit sensitive log access; delete archived data per policy</text><text x="1200.0" y="1590" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64748B" font-weight="600" text-anchor="middle">Core principle: capture durably, process asynchronously, keep business services isolated from telemetry failures.</text></svg>