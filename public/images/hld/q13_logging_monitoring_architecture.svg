<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1650" viewBox="0 0 2400 1650"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#64748B"/></marker></defs><rect width="2400" height="1650" fill="#F8FAFC"/><text x="1200.0" y="55" font-family="Inter,Arial,sans-serif" font-size="38" fill="#102849" font-weight="800" text-anchor="middle">DESIGN A LOGGING &amp; MONITORING SYSTEM</text><text x="1200.0" y="94" font-family="Inter,Arial,sans-serif" font-size="23" fill="#426083" font-weight="600" text-anchor="middle">High-Throughput Telemetry Ingestion, Search, Metrics &amp; Alerting</text><rect x="28" y="125" width="2344" height="650" rx="24" fill="#FFFFFF" stroke="#B8D5F5" stroke-width="2"/><rect x="48" y="145" width="480" height="48" rx="12" fill="#E8F2FF" stroke="#D1E5FF"/><text x="68" y="178" font-family="Inter,Arial,sans-serif" font-size="24" fill="#164E9A" font-weight="750" text-anchor="start">1. HIGH-LEVEL ARCHITECTURE</text><rect x="60" y="265" width="250" height="180" rx="18" fill="#F0F7FF" stroke="#3B82F6" stroke-width="2"/><text x="80" y="300" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Applications &amp; Agents</text><text x="80" y="328" font-family="Inter,Arial,sans-serif" font-size="17" fill="#3B82F6" font-weight="650" text-anchor="start">SDK / sidecar / collector</text><text x="80" y="363" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Structured logs</text><text x="80" y="390" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Metrics + trace spans</text><text x="80" y="417" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Bounded local buffer</text><rect x="355" y="265" width="260" height="180" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>