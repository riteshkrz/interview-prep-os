ns-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Retry may execute more than once</text><text x="85" y="1462" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Use fencing / idempotency downstream</text><rect x="825" y="1310" width="705" height="235" rx="18" fill="#FFF1F2" stroke="#E11D48" stroke-width="2"/><text x="845" y="1345" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Retry policy</text><text x="845" y="1373" font-family="Inter,Arial,sans-serif" font-size="17" fill="#E11D48" font-weight="650" text-anchor="start">Transient vs permanent</text><text x="845" y="1408" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Backoff + jitter; bounded attempts</text><text x="845" y="1435" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Permanent failures skip retries</text><text x="845" y="1462" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Exhausted work enters dead-letter state</text><rect x="1585" y="1310" width="745" height="235" rx="18" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="1605" y="1345" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Correctness target</text><text x="1605" y="1373" font-family="Inter,Arial,sans-serif" font-size="17" fill="#16A34A" font-weight="650" text-anchor="start">Effectively-once business outcome</text><text x="1605" y="1408" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">At-least-once dispatch is realistic</text><text x="1605" y="1435" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Stable execution IDs + idempotent handlers</text><text x="1605" 