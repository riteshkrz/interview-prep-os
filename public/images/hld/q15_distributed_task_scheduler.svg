amily="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Persist a unique occurrence ID so repeated scans do not create duplicate logical runs.</text><rect x="60" y="695" width="2270" height="58" rx="18" fill="#E8F2FF" stroke="#93C5FD" stroke-width="2"/><text x="80" y="730" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Operational signals: schedule lag · overdue count · queue depth · lease expirations · attempt count · execution duration · downstream saturation</text><rect x="28" y="805" width="2344" height="810" rx="24" fill="#FFFFFF" stroke="#B8D5F5" stroke-width="2"/><rect x="48" y="825" width="670" height="48" rx="12" fill="#E8F2FF" stroke="#D1E5FF"/><text x="68" y="858" font-family="Inter,Arial,sans-serif" font-size="24" fill="#164E9A" font-weight="750" text-anchor="start">2. SCHEDULE → CLAIM → EXECUTE → RETRY</text><rect x="60" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="150" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Client</text><line x1="150" y1="952" x2="150" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="375" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="465" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Task API</text><line x1="465" y1="952" x2="465" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="690" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="780" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Task DB</text><line x1="780" y1="952" x2="780" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="1005" y="900" wid