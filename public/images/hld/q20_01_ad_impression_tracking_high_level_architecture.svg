<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1250" viewBox="0 0 1800 1250" role="img" aria-labelledby="svgTitle svgDesc">
<title id="svgTitle">Ad Impression Tracking System — High-Level Architecture</title><desc id="svgDesc">Architecture for high-throughput impression ingestion, durable streaming, raw event archival, deduplication, metadata enrichment, event-time aggregation, analytical reporting, reconciliation and monitoring.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
  <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
  <style>
    text { font-family: Inter, Arial, Helvetica, sans-serif; fill: #172033; }
    .main-title { font-size: 36px; font-weight: 750; fill: #102849; letter-spacing: .2px; }
    .subtitle { font-size: 17px; fill: #64748B; }
    .section-title { font-size: 19px; font-weight: 700; fill: #102849; }
    .card-title { font-size: 17px; font-weight: 700; }
    .body { font-size: 14px; }
    .small { font-size: 12px; }
    .tiny { font-size: 11px; }
    .muted { fill: #64748B; }
    .label { font-size: 12px; font-weight: 700; fill: #2563EB; }
    .flow { fill: none; stroke: #2563EB; stroke-width: 2.1; marker-end: url(#arrow); }
    .flow-gray { fill: none; stroke: #64748B; stroke-width: 1.8; marker-end: url(#arrowGray); }
    .dash { stroke-dasharray: 6 5; }
  </style>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="60" y="62" class="main-title">DESIGN AN AD IMPRESSION TRACKING SYSTEM</text><text x="60" y="96" class="subtitle">01  /  HIGH-LEVEL ARCHITECTURE</text><text x="1740" y="66" class="label" style="fill:#2563EB" text-anchor="end">CORE PIPELINE</text><text x="1740" y="91" class="small" style="fill:#64748B" text-anchor="end">AI/ML fraud scoring is optional and downstream.</text><rect x="50" y="130" width="1700" height="34" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.1"/><text x="64" y="153" class="section-title">A. Near-real-time event path</text><rect x="55" y="195" width="220" height="225" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/><circle cx="86" cy="227" r="15" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="86" y="232" class="body" style="fill:#2563EB" text-anchor="middle">01</text><text x="111" y="224" class="card-title" style="fill:#2563EB">Event Producers</text><text x="73" y="252" class="body">• Website / app / ad server</text><text x="73" y="274" class="body">• Tracking beacon or SDK</text><text x="73" y="296" class="body">• Stable eventId</text><text x="73" y="318" class="body">• Event timestamp + IDs</text><rect x="305" y="195" width="245" height="225" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/><circle cx="336" cy="227" r="15" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="336" y="232" class="body" style="fill:#2563EB" text-anchor="middle">02</text><text x="361" y="224" class="card-title" style="fill:#2563EB">Ingestion API</text><text x="323" y="252" class="body">• Validate schema + required fields</text><text x="323" y="274" class="body">• Enforce size / abuse limits</text><text x="323" y="296" class="body">• Batch and append events</text><text x="323" y="318" class="body">• Ack only after durable accept</text><rect x="580" y="195" width="220" height="225" rx="14" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.6"/><circle cx="611" cy="227" r="15" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/><text x="611" y="232" class="body" style="fill:#6D28D9" text-anchor="middle">03</text><text x="636" y="224" class="card-title" style="fill:#6D28D9">Durable Event Stream</text><text x="598" y="252" class="body">• Kafka topics + partitions</text><text x="598" y="274" class="body">• Buffer traffic bursts</text><text x="598" y="296" class="body">• Decouple producers and consumers</text><text x="598" y="318" class="body">• Replay from retained offsets</text><rect x="830" y="195" width="275" height="225" rx="14" fill="#ECFDF5" stroke="#047857" stroke-width="1.6"/><circle cx="861" cy="227" r="15" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/><text x="861" y="232" class="body" style="fill:#047857" text-anchor="middle">04</text><text x="886" y="224" class="card-title" style="fill:#047857">Stream Processor</text><text x="848" y="252" class="body">• Deduplicate stable event IDs</text><text x="848" y="274" class="body">• Enrich from cached metadata</text><text x="848" y="296" class="body">• Event-time windows + watermarks</text><text x="848" y="318" class="body">• Idempotent aggregate updates</text><rect x="1135" y="195" width="245" height="225" rx="14" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.6"/><circle cx="1166" cy="227" r="15" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/><text x="1166" y="232" class="body" style="fill:#0F766E" text-anchor="middle">05</text><text x="1191" y="224" class="card-title" style="fill:#0F766E">Real-Time OLAP Store</text><text x="1153" y="252" class="body">• Precomputed rollups</text><text x="1153" y="274" class="body">• Campaign / publisher / creative</text><text x="1153" y="296" class="body">• Minute / hour aggregates</text><text x="1153" y="318" class="body">• Provisional live metrics</text><rect x="1410" y="195" width="325" height="225" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/><circle cx="1441" cy="227" r="15" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="1441" y="232" class="body" style="fill:#2563EB" text-anchor="middle">06</text><text x="1466" y="224" class="card-title" style="fill:#2563EB">Reporting API + Dashboard</text><text x="1428" y="252" class="body">• Query aggregate tables, not raw events</text><text x="1428" y="274" class="body">• Filter by campaign and time range</text><text x="1428" y="296" class="body">• Expose freshness / provisional status</text><text x="1428" y="318" class="body">• Monitor latency and data quality</text><path d="M277,307.5 L300,307.5" class="flow"/><path d="M552,307.5 L575,307.5" class="flow"/><path d="M802,307.5 L825,307.5" class="flow"/><path d="M1107,307.5 L1130,307.5" class="flow"/><path d="M1382,307.5 L1405,307.5" class="flow"/><rect x="50" y="465" width="1700" height="34" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.1"/><text x="64" y="488" class="section-title">B. Durable raw-event archive, metadata and reconciliation</text><rect x="65" y="525" width="310" height="160" rx="14" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.6"/><circle cx="96" cy="557" r="15" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/><text x="96" y="562" class="body" style="fill:#6D28D9" text-anchor="middle">A</text><text x="121" y="554" class="card-title" style="fill:#6D28D9">Raw Archive + Object Storage</text><text x="83" y="582" class="body">• Consume and batch raw events</text><text x="83" y="604" class="body">• Compress, partition by date</text><text x="83" y="626" class="body">• Durable source for replay / audit</text><rect x="395" y="525" width="310" height="160" rx="14" fill="#FFFBEB" stroke="#B45309" stroke-width="1.6"/><circle cx="426" cy="557" r="15" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="426" y="562" class="body" style="fill:#B45309" text-anchor="middle">B</text><text x="451" y="554" class="card-title" style="fill:#B45309">Campaign Metadata View</text><text x="413" y="582" class="body">• Campaign / advertiser / creative</text><text x="413" y="604" class="body">• Cached or replicated reference data</text><text x="413" y="626" class="body">• Track version and freshness</text><rect x="725" y="525" width="310" height="160" rx="14" fill="#ECFDF5" stroke="#047857" stroke-width="1.6"/><circle cx="756" cy="557" r="15" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/><text x="756" y="562" class="body" style="fill:#047857" text-anchor="middle">C</text><text x="781" y="554" class="card-title" style="fill:#047857">Batch Reconciliation</text><text x="743" y="582" class="body">• Read raw events + live aggregates</text><text x="743" y="604" class="body">• Recompute selected time ranges</text><text x="743" y="626" class="body">• Compare and create corrections</text><rect x="1055" y="525" width="310" height="160" rx="14" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.6"/><circle cx="1086" cy="557" r="15" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/><text x="1086" y="562" class="body" style="fill:#0F766E" text-anchor="middle">D</text><text x="1111" y="554" class="card-title" style="fill:#0F766E">Historical Results</text><text x="1073" y="582" class="body">• Reconciled reporting tables</text><text x="1073" y="604" class="body">• Finalized metrics / audit views</text><text x="1073" y="626" class="body">• Record correction history</text><rect x="1385" y="525" width="350" height="160" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/><circle cx="1416" cy="557" r="15" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="1416" y="562" class="body" style="fill:#2563EB" text-anchor="middle">E</text><text x="1441" y="554" class="card-title" style="fill:#2563EB">Data Quality + Operations</text><text x="1403" y="582" class="body">• Track lag, duplicate and invalid rates</text><text x="1403" y="604" class="body">• Monitor sink latency and archive lag</text><text x="1403" y="626" class="body">• Govern access and retention</text><path d="M690,420 V508 H220 V520" class="flow"/><path d="M967,420 V515 H550 V520" class="flow-gray dash"/><path d="M1035,605 L1050,605" class="flow"/><path d="M220,685 V710 H880 V690" class="flow-gray dash"/><text x="550" y="704" class="small" style="fill:#64748B" text-anchor="middle">replay raw events and compare with streaming rollups</text><rect x="50" y="765" width="1700" height="34" rx="10" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.1"/><text x="64" y="788" class="section-title">C. Reliability, correctness and operational guardrails</text><rect x="65" y="820" width="310" height="150" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="81" y="850" class="card-title" style="fill:#2563EB">DURABLE ACCEPTANCE</text><text x="81" y="879" class="small">Do not acknowledge an event</text><text x="81" y="899" class="small">before the configured durable</text><text x="81" y="919" class="small">append succeeds.</text><rect x="405" y="820" width="310" height="150" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="421" y="850" class="card-title" style="fill:#047857">IDEMPOTENCY</text><text x="421" y="879" class="small">Dedup by stable eventId; make</text><text x="421" y="899" class="small">sink writes safe under retries.</text><rect x="745" y="820" width="310" height="150" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="761" y="850" class="card-title" style="fill:#6D28D9">EVENT TIME</text><text x="761" y="879" class="small">Define watermarks, allowed</text><text x="761" y="899" class="small">lateness and correction rules</text><text x="761" y="919" class="small">explicitly.</text><rect x="1085" y="820" width="310" height="150" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="1101" y="850" class="card-title" style="fill:#B45309">OBSERVABILITY</text><text x="1101" y="879" class="small">Track throughput, consumer lag,</text><text x="1101" y="899" class="small">duplicates, bad events and sink</text><text x="1101" y="919" class="small">latency.</text><rect x="1425" y="820" width="310" height="150" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="1441" y="850" class="card-title" style="fill:#0F766E">PRIVACY + RETENTION</text><text x="1441" y="879" class="small">Minimize sensitive fields and</text><text x="1441" y="899" class="small">apply retention to raw and</text><text x="1441" y="919" class="small">derived data.</text><rect x="65" y="1010" width="1670" height="125" rx="14" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.2"/><text x="90" y="1044" class="card-title" style="fill:#102849">IMPORTANT DESIGN DISTINCTION</text><text x="90" y="1074" class="body">Streaming metrics optimize freshness; batch reconciliation helps establish corrected historical totals.</text><text x="90" y="1103" class="body">Preserve valid raw events even when enrichment, analytics storage or optional fraud scoring is temporarily unavailable.</text><text x="60" y="1200" class="small" style="fill:#64748B">SYSTEM DESIGN INTERVIEW MASTERCLASS  •  QUESTION 20  •  CORE ARCHITECTURE</text></svg>