<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1650" viewBox="0 0 2400 1650"><defs><marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#64748B"/></marker><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F8FBFF"/><stop offset="1" stop-color="#F7FAFC"/></linearGradient></defs><rect x="0" y="0" width="2400" height="1650" rx="0" fill="url(#bg)" stroke="#F8FAFC" stroke-width="0"/><text x="1200.0" y="58" font-family="Inter, Arial, sans-serif" font-size="38" fill="#102849" font-weight="800" text-anchor="middle">DESIGN A WEB CRAWLER</text><text x="1200.0" y="98" font-family="Inter, Arial, sans-serif" font-size="24" fill="#426083" font-weight="600" text-anchor="middle">High-Level Architecture &amp; Processing Sequence</text><rect x="28" y="125" width="2344" height="720" rx="24" fill="#FFFFFF" stroke="#B8D5F5" stroke-width="2"/><rect x="48" y="145" width="410" height="50" rx="12" fill="#E8F2FF" stroke="#D1E5FF" stroke-width="1"/><text x="70" y="179" font-family="Inter, Arial, sans-serif" font-size="25" fill="#164E9A" font-weight="750" text-anchor="start">1. HIGH-LEVEL ARCHITECTURE</text><rect x="65" y="245" width="260" height="165" rx="18" fill="#F0F7FF" stroke="#3B82F6" stroke-width="2"/><text x="87" y="283" font-family="Inter, Arial, sans-serif" font-size="24" fill="#0F172A" font-weight="700" text-anchor="start">Seed URL Sources</text><text x="87" y="312" font-family="Inter, Arial, sans-serif" font-size="17" fill="#3B82F6" font-weight="600" text-anchor="start">Initial inputs</text><text x="87" y="346" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">Trusted seed lists</text><text x="87" y="373" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">Previously discovered URLs</text><rect x="375" y="245" width="300" height="205" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="397" y="283" font-family="Inter, Arial, sans-serif" font-size="24" fill="#0F172A" font-weight="700" text-anchor="start">URL Frontier / Scheduler</text><text x="397" y="312" font-family="Inter, Arial, sans-serif" font-size="17" fill="#2563EB" font-weight="600" text-anchor="start">Durable priority queue</text><text x="397" y="346" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">Canonical URL + host</text><text x="397" y="373" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">Priority and next_fetch_at</text><text x="397" y="400" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">Lease / claim due work</text><rect x="735" y="225" width="315" height="230" rx="18" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="757" y="263" font-family="Inter, Arial, sans-serif" font-size="24" fill="#0F172A" font-weight="700" text-anchor="start">Robots &amp; Politeness</text><text x="757" y="292" font-family="Inter, Arial, sans-serif" font-size="17" fill="#16A34A" font-weight="600" text-anchor="start">Per-host policy layer</text><text x="757" y="326" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">Fetch/cache robots.txt</text><text x="757" y="353" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">Per-host delay &amp; concurrency</text><text x="757" y="380" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">URL allow/deny checks</text><text x="757" y="407" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">Host fairness / backoff</text><rect x="1110" y="245" width="300" height="205" rx="18" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/><text x="1132" y="283" font-family="Inter, Arial, sans-serif" font-size="24" fill="#0F172A" font-weight="700" text-anchor="start">Distributed Fetch Workers</text><text x="1132" y="312" font-family="Inter, Arial, sans-serif" font-size="17" fill="#EA580C" font-weight="600" text-anchor="start">Bounded worker fleet</text><text x="1132" y="346" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">Lease URL from frontier</text><text x="1132" y="373" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">HTTP timeout / size limits</text><text x="1132" y="400" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">Capture status and headers</text><text x="1132" y="427" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">Retry transient failures</text><rect x="1470" y="245" width="295" height="205" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="1492" y="283" font-family="Inter, Arial, sans-serif" font-size="24" fill="#0F172A" font-weight="700" text-anchor="start">Parser &amp; Canonicalizer</text><text x="1492" y="312" font-family="Inter, Arial, sans-serif" font-size="17" fill="#7C3AED" font-weight="600" text-anchor="start">HTML processing</text><text x="1492" y="346" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">Extract hyperlinks</text><text x="1492" y="373" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">Normalize URL forms</text><text x="1492" y="400" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">Extract page metadata</text><text x="1492" y="427" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">Detect redirects / invalid URLs</text><rect x="1825" y="225" width="285" height="225" rx="18" fill="#FFF1F2" stroke="#E11D48" stroke-width="2"/><text x="1847" y="263" font-family="Inter, Arial, sans-serif" font-size="24" fill="#0F172A" font-weight="700" text-anchor="start">Deduplication Layer</text><text x="1847" y="292" font-family="Inter, Arial, sans-serif" font-size="17" fill="#E11D48" font-weight="600" text-anchor="start">Fast filter + source of truth</text><text x="1847" y="326" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">Bloom filter: quick check</text><text x="1847" y="353" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">Durable URL store</text><text x="1847" y="380" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">Atomic claim / lease</text><text x="1847" y="407" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">Avoid concurrent duplicate fetches</text><rect x="2150" y="245" width="190" height="205" rx="18" fill="#ECFEFF" stroke="#0891B2" stroke-width="2"/><text x="2172" y="283" font-family="Inter, Arial, sans-serif" font-size="24" fill="#0F172A" font-weight="700" text-anchor="start">Content Storage</text><text x="2172" y="312" font-family="Inter, Arial, sans-serif" font-size="17" fill="#0891B2" font-weight="600" text-anchor="start">Durable page data</text><text x="2172" y="346" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">Object storage</text><text x="2172" y="373" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">Page metadata DB</text><text x="2172" y="400" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">Hash / fetch timestamp</text><line x1="325" y1="326" x2="375" y2="326" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/><line x1="675" y1="326" x2="735" y2="326" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/><line x1="1050" y1="326" x2="1110" y2="326" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/><line x1="1410" y1="326" x2="1470" y2="326" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/><line x1="1765" y1="326" x2="1825" y2="326" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/><line x1="2110" y1="326" x2="2150" y2="326" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/><path d="M1615 450 L1615 490 L525 490 L525 450" fill="none" stroke="#2563EB" stroke-width="3" stroke-dasharray="10,7" marker-end="url(#arrow)"/><text x="1065" y="480" font-family="Inter, Arial, sans-serif" font-size="18" fill="#2563EB" font-weight="650" text-anchor="middle">New links return to frontier for scheduling</text><rect x="1825" y="530" width="515" height="155" rx="18" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="1847" y="568" font-family="Inter, Arial, sans-serif" font-size="24" fill="#0F172A" font-weight="700" text-anchor="start">Search Indexing Pipeline</text><text x="1847" y="597" font-family="Inter, Arial, sans-serif" font-size="17" fill="#64748B" font-weight="600" text-anchor="start">Downstream consumer</text><text x="1847" y="631" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">Receive selected page records / metadata</text><text x="1847" y="658" font-family="Inter, Arial, sans-serif" font-size="18" fill="#334155" font-weight="400" text-anchor="start">Build or refresh index outside crawler hot path</text><path d="M2245 450 L2245 530" fill="none" stroke="#64748B" stroke-width="3" marker-end="url(#arrow)"/><rect x="65" y="535" width="1695" height="150" rx="16" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="2" stroke-dasharray="9,6"/><text x="88" y="570" font-family="Inter, Arial, sans-serif" font-size="23" fill="#334155" font-weight="700" text-anchor="start">Reliability &amp; operational controls</text><text x="88" y="605" font-family="Inter, Arial, sans-serif" font-size="19" fill="#475569" font-weight="400" text-anchor="start">Durable queue + leases · Retry with exponential backoff · Dead-letter / quarantine repeated failures</text><text x="88" y="636" font-family="Inter, Arial, sans-serif" font-size="19" fill="#475569" font-weight="400" text-anchor="start">Metrics: queue lag, fetch latency, status codes, host throttling, duplicate rate, worker saturation</text><rect x="65" y="710" width="1695" height="95" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="2"/><text x="88" y="746" font-family="Inter, Arial, sans-serif" font-size="22" fill="#92400E" font-weight="700" text-anchor="start">Responsible crawling</text><text x="88" y="779" font-family="Inter, Arial, sans-serif" font-size="19" fill="#78350F" font-weight="500" text-anchor="start">Honor robots.txt and site policies; identify the crawler; limit per-host load; cap redirects, response size and request rate.</text><rect x="28" y="875" width="2344" height="745" rx="24" fill="#FFFFFF" stroke="#B8D5F5" stroke-width="2"/><rect x="48" y="895" width="550" height="50" rx="12" fill="#E8F2FF" stroke="#D1E5FF" stroke-width="1"/><text x="70" y="929" font-family="Inter, Arial, sans-serif" font-size="25" fill="#164E9A" font-weight="750" text-anchor="start">2. REQUEST SEQUENCE: FETCH A URL</text><rect x="20" y="980" width="160" height="58" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="100" y="1015" font-family="Inter, Arial, sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Scheduler</text><line x1="100" y1="1038" x2="100" y2="1428" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="305" y="980" width="160" height="58" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="385" y="1015" font-family="Inter, Arial, sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Frontier DB</text><line x1="385" y1="1038" x2="385" y2="1428" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="590" y="980" width="160" height="58" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="670" y="1015" font-family="Inter, Arial, sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Fetch Worker</text><line x1="670" y1="1038" x2="670" y2="1428" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="875" y="980" width="160" height="58" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="955" y="1015" font-family="Inter, Arial, sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Web Host</text><line x1="955" y1="1038" x2="955" y2="1428" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="1160" y="980" width="160" height="58" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="1240" y="1015" font-family="Inter, Arial, sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Parser</text><line x1="1240" y1="1038" x2="1240" y2="1428" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="1445" y="980" width="160" height="58" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="1525" y="1015" font-family="Inter, Arial, sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Dedup Store</text><line x1="1525" y1="1038" x2="1525" y2="1428" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="1730" y="980" width="160" height="58" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="1810" y="1015" font-family="Inter, Arial, sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Content Store</text><line x1="1810" y1="1038" x2="1810" y2="1428" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="2015" y="980" width="160" height="58" rx="12" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="2095" y="1015" font-family="Inter, Arial, sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Index Queue</text><line x1="2095" y1="1038" x2="2095" y2="1428" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><line x1="100" y1="1070" x2="385" y2="1070" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/><text x="242.5" y="1060" font-family="Inter, Arial, sans-serif" font-size="16" fill="#1E40AF" font-weight="600" text-anchor="middle">1. Claim due URL / acquire lease</text><line x1="385" y1="1116" x2="670" y2="1116" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/><text x="527.5" y="1106" font-family="Inter, Arial, sans-serif" font-size="16" fill="#1E40AF" font-weight="600" text-anchor="middle">2. Return canonical URL + lease</text><line x1="670" y1="1162" x2="955" y2="1162" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/><text x="812.5" y="1152" font-family="Inter, Arial, sans-serif" font-size="16" fill="#1E40AF" font-weight="600" text-anchor="middle">3. GET page (timeouts / limits)</text><line x1="955" y1="1208" x2="1240" y2="1208" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1097.5" y="1198" font-family="Inter, Arial, sans-serif" font-size="16" fill="#1E40AF" font-weight="600" text-anchor="middle">4. Return status, headers, HTML</text><line x1="1240" y1="1254" x2="1525" y2="1254" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1382.5" y="1244" font-family="Inter, Arial, sans-serif" font-size="16" fill="#1E40AF" font-weight="600" text-anchor="middle">5. Canonicalize discovered links; check seen state</text><line x1="1240" y1="1300" x2="1810" y2="1300" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1525.0" y="1290" font-family="Inter, Arial, sans-serif" font-size="16" fill="#1E40AF" font-weight="600" text-anchor="middle">6. Persist page body + metadata</text><line x1="1525" y1="1346" x2="385" y2="1346" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/><text x="955.0" y="1336" font-family="Inter, Arial, sans-serif" font-size="16" fill="#1E40AF" font-weight="600" text-anchor="middle">7. Atomically claim new URLs / enqueue eligible links</text><line x1="1810" y1="1392" x2="2095" y2="1392" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arrow)"/><text x="1952.5" y="1382" font-family="Inter, Arial, sans-serif" font-size="16" fill="#1E40AF" font-weight="600" text-anchor="middle">8. Emit indexable record / metadata</text><rect x="65" y="1465" width="2270" height="120" rx="16" fill="#FFF7ED" stroke="#FDBA74" stroke-width="2"/><text x="90" y="1502" font-family="Inter, Arial, sans-serif" font-size="23" fill="#9A3412" font-weight="700" text-anchor="start">Failure, retries &amp; recovery</text><text x="90" y="1538" font-family="Inter, Arial, sans-serif" font-size="18" fill="#7C2D12" font-weight="500" text-anchor="start">If a worker crashes or a request times out, its lease expires; the URL becomes eligible for retry. Writes are idempotent,</text><text x="90" y="1568" font-family="Inter, Arial, sans-serif" font-size="18" fill="#7C2D12" font-weight="500" text-anchor="start">retries use backoff, and persistently failing URLs are isolated so one host cannot starve the rest of the crawl.</text><text x="1200.0" y="1638" font-family="Inter, Arial, sans-serif" font-size="17" fill="#64748B" font-weight="600" text-anchor="middle">Core principle: durable scheduling + polite fetching + reliable deduplication + replayable content storage</text></svg>