<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1650" viewBox="0 0 2400 1650"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#64748B"/></marker></defs><rect width="2400" height="1650" fill="#F8FAFC"/><text x="1200.0" y="55" font-family="Inter,Arial,sans-serif" font-size="38" fill="#102849" font-weight="800" text-anchor="middle">DESIGN A CLOUD FILE STORAGE SERVICE</text><text x="1200.0" y="94" font-family="Inter,Arial,sans-serif" font-size="23" fill="#426083" font-weight="600" text-anchor="middle">Chunked Uploads · Metadata Versions · Device Sync · Conflict Resolution</text><rect x="28" y="125" width="2344" height="650" rx="24" fill="#FFFFFF" stroke="#B8D5F5" stroke-width="2"/><rect x="48" y="145" width="480" height="48" rx="12" fill="#E8F2FF" stroke="#D1E5FF"/><text x="68" y="178" font-family="Inter,Arial,sans-serif" font-size="24" fill="#164E9A" font-weight="750" text-anchor="start">1. HIGH-LEVEL ARCHITECTURE</text><rect x="60" y="265" width="250" height="180" rx="18" fill="#F0F7FF" stroke="#3B82F6" stroke-width="2"/><text x="80" y="300" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Desktop / Mobile Client</text><text x="80" y="328" font-family="Inter,Arial,sans-serif" font-size="17" fill="#3B82F6" font-weight="650" text-anchor="start">Sync agent</text><text x="80" y="363" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Track local file IDs / hashes</text><text x="80" y="390" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Keep last sync cursor</text><text x="80" y="417" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Queue local changes</text><rect x="355" y="265" width="265" height="180" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="375" y="300" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">API Gateway</text><text x="375" y="328" font-family="Inter,Arial,sans-serif" font-size="17" fill="#2563EB" font-weight="650" text-anchor="start">Secure entry</text><text x="375" y="363" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Authentication / authorization</text><text x="375" y="390" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Rate limits and quotas</text><text x="375" y="417" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Route metadata vs blob transfer</text><rect x="665" y="245" width="300" height="200" rx="18" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="685" y="280" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Metadata Service</text><text x="685" y="308" font-family="Inter,Arial,sans-serif" font-size="17" fill="#16A34A" font-weight="650" text-anchor="start">Authoritative catalog</text><text x="685" y="343" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">File / folder paths</text><text x="685" y="370" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Version pointers + hashes</text><text x="685" y="397" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Share permissions / tombstones</text><rect x="1010" y="245" width="295" height="200" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="1030" y="280" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Sync Service</text><text x="1030" y="308" font-family="Inter,Arial,sans-serif" font-size="17" fill="#7C3AED" font-weight="650" text-anchor="start">Change log + cursor</text><text x="1030" y="343" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Return changes since cursor</text><text x="1030" y="370" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Notify other devices to pull</text><text x="1030" y="397" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Detect concurrent version edits</text><rect x="1350" y="245" width="300" height="200" rx="18" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/><text x="1370" y="280" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Upload / Chunk Service</text><text x="1370" y="308" font-family="Inter,Arial,sans-serif" font-size="17" fill="#EA580C" font-weight="650" text-anchor="start">Resumable transfer</text><text x="1370" y="343" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Split large file into chunks</text><text x="1370" y="370" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Checksums + retry missing parts</text><text x="1370" y="397" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Finalize only after all parts exist</text><rect x="1695" y="245" width="285" height="200" rx="18" fill="#ECFEFF" stroke="#0891B2" stroke-width="2"/><text x="1715" y="280" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Object Storage</text><text x="1715" y="308" font-family="Inter,Arial,sans-serif" font-size="17" fill="#0891B2" font-weight="650" text-anchor="start">Durable file bytes</text><text x="1715" y="343" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Store chunks / assembled objects</text><text x="1715" y="370" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Versioned object keys</text><text x="1715" y="397" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Lifecycle / replication policy</text><rect x="2025" y="245" width="305" height="200" rx="18" fill="#FFF1F2" stroke="#E11D48" stroke-width="2"/><text x="2045" y="280" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Download + CDN</text><text x="2045" y="308" font-family="Inter,Arial,sans-serif" font-size="17" fill="#E11D48" font-weight="650" text-anchor="start">Efficient reads</text><text x="2045" y="343" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Authorize file access</text><text x="2045" y="370" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Short-lived signed URLs</text><text x="2045" y="397" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Cache authorized content</text><line x1="310" y1="340" x2="355" y2="340" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="620" y1="340" x2="665" y2="340" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="965" y1="340" x2="1010" y2="340" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="1305" y1="340" x2="1350" y2="340" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="1650" y1="340" x2="1695" y2="340" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="1980" y1="340" x2="2025" y2="340" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><rect x="60" y="510" width="700" height="155" rx="18" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="80" y="545" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Metadata Database + Cache</text><text x="80" y="573" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64748B" font-weight="650" text-anchor="start">SQL / distributed store</text><text x="80" y="608" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Owner, path, version, size, content hash, current_version_id</text><text x="80" y="635" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Conditional version updates; cache is not the source of truth</text><rect x="800" y="510" width="700" height="155" rx="18" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/><text x="820" y="545" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Change Events / Notification Queue</text><text x="820" y="573" font-family="Inter,Arial,sans-serif" font-size="17" fill="#D97706" font-weight="650" text-anchor="start">Durable sync signals</text><text x="820" y="608" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Append a change record and publish a notification.</text><text x="820" y="635" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Notifications are hints; the durable change log enables recovery.</text><rect x="1540" y="510" width="790" height="155" rx="18" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="1560" y="545" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Access, Versions &amp; Garbage Collection</text><text x="1560" y="573" font-family="Inter,Arial,sans-serif" font-size="17" fill="#16A34A" font-weight="650" text-anchor="start">Safety rules</text><text x="1560" y="608" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Keep both conflicting versions instead of overwriting silently.</text><text x="1560" y="635" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Delete unreferenced blobs only when no retained/restorable version depends on them.</text><path d="M800 445 L800 485 L410 485 L410 510" fill="none" stroke="#64748B" stroke-width="2.5" stroke-dasharray="8,6" marker-end="url(#arr)"/><path d="M1095 445 L1095 490 L1150 490 L1150 510" fill="none" stroke="#64748B" stroke-width="2.5" stroke-dasharray="8,6" marker-end="url(#arr)"/><path d="M1835 445 L1835 485 L1940 485 L1940 510" fill="none" stroke="#64748B" stroke-width="2.5" stroke-dasharray="8,6" marker-end="url(#arr)"/><rect x="28" y="805" width="2344" height="810" rx="24" fill="#FFFFFF" stroke="#B8D5F5" stroke-width="2"/><rect x="48" y="825" width="690" height="48" rx="12" fill="#E8F2FF" stroke="#D1E5FF"/><text x="68" y="858" font-family="Inter,Arial,sans-serif" font-size="24" fill="#164E9A" font-weight="750" text-anchor="start">2. CHUNKED UPLOAD &amp; CROSS-DEVICE SYNC</text><rect x="60" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="150" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Client A</text><line x1="150" y1="952" x2="150" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="375" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="465" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Sync API</text><line x1="465" y1="952" x2="465" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="690" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="780" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Metadata DB</text><line x1="780" y1="952" x2="780" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="1005" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="1095" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Object Store</text><line x1="1095" y1="952" x2="1095" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="1320" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="1410" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Sync Service</text><line x1="1410" y1="952" x2="1410" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="1635" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="1725" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Change Queue</text><line x1="1725" y1="952" x2="1725" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="1950" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="2040" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Client B</text><line x1="2040" y1="952" x2="2040" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><line x1="150" y1="985" x2="465" y2="985" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="307.5" y="975" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">1. Start upload; obtain session / signed URLs</text><line x1="465" y1="1030" x2="780" y2="1030" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="622.5" y="1020" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">2. Create pending version + expected chunk metadata</text><line x1="150" y1="1075" x2="1095" y2="1075" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="622.5" y="1065" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">3. Upload chunks directly; retry failed parts</text><line x1="1095" y1="1120" x2="780" y2="1120" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="937.5" y="1110" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">4. Verify checksums; finalize content object</text><line x1="780" y1="1165" x2="1410" y2="1165" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="1095.0" y="1155" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">5. Conditional version-pointer update + change-log entry</text><line x1="1410" y1="1210" x2="1725" y2="1210" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="1567.5" y="1200" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">6. Publish change notification</text><line x1="1725" y1="1255" x2="2040" y2="1255" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="1882.5" y="1245" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">7. Client B pulls changes since its sync cursor</text><rect x="65" y="1310" width="705" height="235" rx="18" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/><text x="85" y="1345" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Concurrent edits</text><text x="85" y="1373" font-family="Inter,Arial,sans-serif" font-size="17" fill="#EA580C" font-weight="650" text-anchor="start">Optimistic concurrency</text><text x="85" y="1408" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Compare base version / ETag on commit</text><text x="85" y="1435" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Preserve both versions or create a conflict copy</text><rect x="825" y="1310" width="705" height="235" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="845" y="1345" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Offline device catch-up</text><text x="845" y="1373" font-family="Inter,Arial,sans-serif" font-size="17" fill="#7C3AED" font-weight="650" text-anchor="start">Cursor-based sync</text><text x="845" y="1408" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Pull durable change log since last cursor</text><text x="845" y="1435" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Apply tombstones; reconcile local changes</text><rect x="1585" y="1310" width="745" height="235" rx="18" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="1605" y="1345" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Access control</text><text x="1605" y="1373" font-family="Inter,Arial,sans-serif" font-size="17" fill="#16A34A" font-weight="650" text-anchor="start">Private and shared files</text><text x="1605" y="1408" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Check permissions on metadata and blob access</text><text x="1605" y="1435" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Revocable scoped links + short-lived signed URLs</text><text x="1200.0" y="1590" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64748B" font-weight="600" text-anchor="middle">Core principle: object bytes are separate from metadata; version checks and a durable change log make sync recoverable.</text></svg>