<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1650" viewBox="0 0 2400 1650"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#64748B"/></marker></defs><rect width="2400" height="1650" fill="#F8FAFC"/><text x="1200.0" y="55" font-family="Inter,Arial,sans-serif" font-size="38" fill="#102849" font-weight="800" text-anchor="middle">DESIGN A TICKET BOOKING SYSTEM</text><text x="1200.0" y="94" font-family="Inter,Arial,sans-serif" font-size="23" fill="#426083" font-weight="600" text-anchor="middle">Seat Availability · Five-Minute Holds · Payment · Double-Booking Prevention</text><rect x="28" y="125" width="2344" height="650" rx="24" fill="#FFFFFF" stroke="#B8D5F5" stroke-width="2"/><rect x="48" y="145" width="480" height="48" rx="12" fill="#E8F2FF" stroke="#D1E5FF"/><text x="68" y="178" font-family="Inter,Arial,sans-serif" font-size="24" fill="#164E9A" font-weight="750" text-anchor="start">1. HIGH-LEVEL ARCHITECTURE</text><rect x="60" y="265" width="250" height="180" rx="18" fill="#F0F7FF" stroke="#3B82F6" stroke-width="2"/><text x="80" y="300" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Buyer / Client</text><text x="80" y="328" font-family="Inter,Arial,sans-serif" font-size="17" fill="#3B82F6" font-weight="650" text-anchor="start">Web / mobile</text><text x="80" y="363" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Browse events and seats</text><text x="80" y="390" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Select seat / checkout</text><text x="80" y="417" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Retry with idempotency key</text><rect x="355" y="265" width="275" height="180" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="375" y="300" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Booking API</text><text x="375" y="328" font-family="Inter,Arial,sans-serif" font-size="17" fill="#2563EB" font-weight="650" text-anchor="start">Entry + protection</text><text x="375" y="363" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Authentication / authorization</text><text x="375" y="390" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Rate limit / bot controls</text><text x="375" y="417" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Virtual waiting room if needed</text><rect x="675" y="245" width="295" height="200" rx="18" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/><text x="695" y="280" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Availability Service</text><text x="695" y="308" font-family="Inter,Arial,sans-serif" font-size="17" fill="#EA580C" font-weight="650" text-anchor="start">Read path</text><text x="695" y="343" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Show current seat snapshot</text><text x="695" y="370" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Fast inventory queries</text><text x="695" y="397" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Availability is advisory only</text><rect x="1015" y="245" width="330" height="200" rx="18" fill="#FFF1F2" stroke="#E11D48" stroke-width="2"/><text x="1035" y="280" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Authoritative Seat Store</text><text x="1035" y="308" font-family="Inter,Arial,sans-serif" font-size="17" fill="#E11D48" font-weight="650" text-anchor="start">Correctness boundary</text><text x="1035" y="343" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Unique (event_id, seat_id)</text><text x="1035" y="370" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">AVAILABLE → HELD → BOOKED</text><text x="1035" y="397" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">hold_id + expires_at + version</text><rect x="1390" y="245" width="285" height="200" rx="18" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="1410" y="280" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Booking Service</text><text x="1410" y="308" font-family="Inter,Arial,sans-serif" font-size="17" fill="#16A34A" font-weight="650" text-anchor="start">Pending booking</text><text x="1410" y="343" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Link booking to hold</text><text x="1410" y="370" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Track payment / booking states</text><text x="1410" y="397" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Idempotent booking creation</text><rect x="1720" y="245" width="280" height="200" rx="18" fill="#ECFEFF" stroke="#0891B2" stroke-width="2"/><text x="1740" y="280" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Payment Service</text><text x="1740" y="308" font-family="Inter,Arial,sans-serif" font-size="17" fill="#0891B2" font-weight="650" text-anchor="start">External payment</text><text x="1740" y="343" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Stable idempotency key</text><text x="1740" y="370" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Provider callbacks / status query</text><text x="1740" y="397" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Handle late outcomes</text><rect x="2045" y="245" width="285" height="200" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="2065" y="280" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Ticket Issuer</text><text x="2065" y="308" font-family="Inter,Arial,sans-serif" font-size="17" fill="#7C3AED" font-weight="650" text-anchor="start">Only after confirm</text><text x="2065" y="343" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Generate ticket / QR</text><text x="2065" y="370" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Persist ticket ID</text><text x="2065" y="397" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Notify customer</text><line x1="310" y1="335" x2="355" y2="335" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="630" y1="335" x2="675" y2="335" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="970" y1="335" x2="1015" y2="335" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="1345" y1="335" x2="1390" y2="335" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="1675" y1="335" x2="1720" y2="335" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="2000" y1="335" x2="2045" y2="335" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><rect x="60" y="500" width="700" height="165" rx="18" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/><text x="80" y="535" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Hold Expiry Worker</text><text x="80" y="563" font-family="Inter,Arial,sans-serif" font-size="17" fill="#EA580C" font-weight="650" text-anchor="start">Timeout cleanup</text><text x="80" y="598" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Find expired holds by time / index</text><text x="80" y="625" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Release only if hold_id + status still match</text><path d="M410 500 L410 465 L1150 465 L1150 445" fill="none" stroke="#EA580C" stroke-width="3" stroke-dasharray="8,6" marker-end="url(#arr)"/><rect x="800" y="500" width="700" height="165" rx="18" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="820" y="535" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Seat contention rule</text><text x="820" y="563" font-family="Inter,Arial,sans-serif" font-size="17" fill="#16A34A" font-weight="650" text-anchor="start">Atomic conditional transition</text><text x="820" y="598" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Two requests can see the same open seat, but only one hold succeeds.</text><text x="820" y="625" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">The database—not a cache or application memory—is authoritative.</text><rect x="1540" y="500" width="790" height="165" rx="18" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="1560" y="535" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Late payment / overload policy</text><text x="1560" y="563" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64748B" font-weight="650" text-anchor="start">Defined recovery</text><text x="1560" y="598" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">If hold expired and seat is booked: void/refund and notify buyer.</text><text x="1560" y="625" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Throttle demand; keep payment and booking state reconcilable.</text><rect x="28" y="805" width="2344" height="810" rx="24" fill="#FFFFFF" stroke="#B8D5F5" stroke-width="2"/><rect x="48" y="825" width="700" height="48" rx="12" fill="#E8F2FF" stroke="#D1E5FF"/><text x="68" y="858" font-family="Inter,Arial,sans-serif" font-size="24" fill="#164E9A" font-weight="750" text-anchor="start">2. SEAT HOLD → PAYMENT → CONFIRMATION</text><rect x="60" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="150" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Buyer A</text><line x1="150" y1="952" x2="150" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="375" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="465" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Booking API</text><line x1="465" y1="952" x2="465" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="690" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="780" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Seat Store</text><line x1="780" y1="952" x2="780" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="1005" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="1095" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Booking Service</text><line x1="1095" y1="952" x2="1095" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="1320" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="1410" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Payment Provider</text><line x1="1410" y1="952" x2="1410" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="1635" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="1725" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Expiry Worker</text><line x1="1725" y1="952" x2="1725" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="1950" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="2040" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Ticket Issuer</text><line x1="2040" y1="952" x2="2040" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><line x1="150" y1="985" x2="465" y2="985" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="307.5" y="975" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">1. Request seat S-12 + idempotency key</text><line x1="465" y1="1030" x2="780" y2="1030" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="622.5" y="1020" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">2. Conditional AVAILABLE → HELD (hold ID + TTL)</text><line x1="780" y1="1075" x2="1095" y2="1075" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="937.5" y="1065" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">3. Create PENDING booking linked to hold</text><line x1="1095" y1="1120" x2="1410" y2="1120" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="1252.5" y="1110" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">4. Charge using stable payment idempotency key</text><line x1="1410" y1="1165" x2="1095" y2="1165" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="1252.5" y="1155" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">5. Confirm provider outcome / webhook</text><line x1="1095" y1="1210" x2="780" y2="1210" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="937.5" y="1200" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">6. Recheck hold identity; transition HELD → BOOKED</text><line x1="1095" y1="1255" x2="2040" y2="1255" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="1567.5" y="1245" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">7. Issue ticket only after booking confirmed</text><rect x="65" y="1310" width="705" height="235" rx="18" fill="#FFF1F2" stroke="#E11D48" stroke-width="2"/><text x="85" y="1345" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Concurrent seat request</text><text x="85" y="1373" font-family="Inter,Arial,sans-serif" font-size="17" fill="#E11D48" font-weight="650" text-anchor="start">Expected outcome</text><text x="85" y="1408" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">A second buyer’s conditional hold fails</text><text x="85" y="1435" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Return seat unavailable; offer alternatives</text><rect x="825" y="1310" width="705" height="235" rx="18" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/><text x="845" y="1345" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Hold expires during payment</text><text x="845" y="1373" font-family="Inter,Arial,sans-serif" font-size="17" fill="#EA580C" font-weight="650" text-anchor="start">Compensation</text><text x="845" y="1408" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Expiry checks current hold ID and status</text><text x="845" y="1435" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Late successful payment → void / refund if seat lost</text><rect x="1585" y="1310" width="745" height="235" rx="18" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="1605" y="1345" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">High-demand event sale</text><text x="1605" y="1373" font-family="Inter,Arial,sans-serif" font-size="17" fill="#16A34A" font-weight="650" text-anchor="start">Capacity protection</text><text x="1605" y="1408" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Virtual queue + per-user rate limits</text><text x="1605" y="1435" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Bound checkout concurrency; keep seat state authoritative</text><text x="1200.0" y="1590" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64748B" font-weight="600" text-anchor="middle">Core principle: availability reads can be stale; the final seat hold and booking transition must be atomic.</text></svg>