<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="1650" viewBox="0 0 2400 1650"><defs><marker id="arr" markerWidth="12" markerHeight="12" refX="9" refY="4" orient="auto"><path d="M0,0 L9,4 L0,8 Z" fill="#64748B"/></marker></defs><rect width="2400" height="1650" fill="#F8FAFC"/><text x="1200.0" y="55" font-family="Inter,Arial,sans-serif" font-size="38" fill="#102849" font-weight="800" text-anchor="middle">DESIGN A PAYMENT SYSTEM</text><text x="1200.0" y="94" font-family="Inter,Arial,sans-serif" font-size="23" fill="#426083" font-weight="600" text-anchor="middle">Idempotency · Payment State Machine · Ledger · Webhooks · Reconciliation</text><rect x="28" y="125" width="2344" height="650" rx="24" fill="#FFFFFF" stroke="#B8D5F5" stroke-width="2"/><rect x="48" y="145" width="480" height="48" rx="12" fill="#E8F2FF" stroke="#D1E5FF"/><text x="68" y="178" font-family="Inter,Arial,sans-serif" font-size="24" fill="#164E9A" font-weight="750" text-anchor="start">1. HIGH-LEVEL ARCHITECTURE</text><rect x="60" y="265" width="250" height="180" rx="18" fill="#F0F7FF" stroke="#3B82F6" stroke-width="2"/><text x="80" y="300" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Merchant / Order Service</text><text x="80" y="328" font-family="Inter,Arial,sans-serif" font-size="17" fill="#3B82F6" font-weight="650" text-anchor="start">Caller</text><text x="80" y="363" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Order ID + amount + currency</text><text x="80" y="390" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Stable idempotency key</text><text x="80" y="417" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Consume payment outcome</text><rect x="355" y="265" width="275" height="180" rx="18" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/><text x="375" y="300" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Payment API</text><text x="375" y="328" font-family="Inter,Arial,sans-serif" font-size="17" fill="#2563EB" font-weight="650" text-anchor="start">Validate + deduplicate</text><text x="375" y="363" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Check amount / currency</text><text x="375" y="390" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Idempotency constraint</text><text x="375" y="417" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Create or return payment ID</text><rect x="675" y="245" width="300" height="200" rx="18" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="695" y="280" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Payment State Machine</text><text x="695" y="308" font-family="Inter,Arial,sans-serif" font-size="17" fill="#16A34A" font-weight="650" text-anchor="start">Authoritative lifecycle</text><text x="695" y="343" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">CREATED / PENDING / FAILED</text><text x="695" y="370" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">AUTHORIZED / CAPTURED</text><text x="695" y="397" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">REFUNDED / UNKNOWN</text><rect x="1020" y="245" width="285" height="200" rx="18" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/><text x="1040" y="280" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Provider Adapter</text><text x="1040" y="308" font-family="Inter,Arial,sans-serif" font-size="17" fill="#EA580C" font-weight="650" text-anchor="start">External integration</text><text x="1040" y="343" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Normalize provider API</text><text x="1040" y="370" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Call with provider idempotency</text><text x="1040" y="397" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Treat timeout as ambiguous</text><rect x="1350" y="245" width="285" height="200" rx="18" fill="#ECFEFF" stroke="#0891B2" stroke-width="2"/><text x="1370" y="280" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Payment Provider</text><text x="1370" y="308" font-family="Inter,Arial,sans-serif" font-size="17" fill="#0891B2" font-weight="650" text-anchor="start">External boundary</text><text x="1370" y="343" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Authorization / capture</text><text x="1370" y="370" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Refund / void</text><text x="1370" y="397" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Provider reference + settlement</text><rect x="1680" y="245" width="285" height="200" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="1700" y="280" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Webhook Handler</text><text x="1700" y="308" font-family="Inter,Arial,sans-serif" font-size="17" fill="#7C3AED" font-weight="650" text-anchor="start">Async provider outcomes</text><text x="1700" y="343" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Verify signature</text><text x="1700" y="370" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Deduplicate event IDs</text><text x="1700" y="397" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Apply valid state transition</text><rect x="2010" y="230" width="320" height="215" rx="18" fill="#FFF1F2" stroke="#E11D48" stroke-width="2"/><text x="2030" y="265" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Payment DB + Ledger</text><text x="2030" y="293" font-family="Inter,Arial,sans-serif" font-size="17" fill="#E11D48" font-weight="650" text-anchor="start">Durable financial record</text><text x="2030" y="328" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Payment and provider references</text><text x="2030" y="355" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Append-only ledger / reversals</text><text x="2030" y="382" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Auditable status history</text><line x1="310" y1="335" x2="355" y2="335" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="630" y1="335" x2="675" y2="335" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="975" y1="335" x2="1020" y2="335" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="1305" y1="335" x2="1350" y2="335" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="1635" y1="335" x2="1680" y2="335" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><line x1="1965" y1="335" x2="2010" y2="335" stroke="#64748B" stroke-width="3" marker-end="url(#arr)"/><path d="M1490 445 L1490 475 L1820 475 L1820 445" fill="none" stroke="#7C3AED" stroke-width="2.5" stroke-dasharray="7,6" marker-end="url(#arr)"/><text x="1650" y="468" font-family="Inter,Arial,sans-serif" font-size="15" fill="#5B21B6" font-weight="600" text-anchor="middle">provider callback / status</text><rect x="60" y="520" width="700" height="165" rx="18" fill="#F8FAFC" stroke="#64748B" stroke-width="2"/><text x="80" y="555" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Reliable outcome publication</text><text x="80" y="583" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64748B" font-weight="650" text-anchor="start">Outbox / event bus</text><text x="80" y="618" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Commit payment outcome and outbox record together.</text><text x="80" y="645" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Publish result to order service / downstream consumers.</text><rect x="800" y="520" width="700" height="165" rx="18" fill="#FFFBEB" stroke="#D97706" stroke-width="2"/><text x="820" y="555" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Reconciliation worker</text><text x="820" y="583" font-family="Inter,Arial,sans-serif" font-size="17" fill="#D97706" font-weight="650" text-anchor="start">Scheduled comparison</text><text x="820" y="618" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Compare internal records with provider transactions and settlement reports.</text><text x="820" y="645" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Find missing callbacks, amount mismatches and stuck refunds.</text><rect x="1540" y="520" width="790" height="165" rx="18" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="1560" y="555" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Security &amp; audit controls</text><text x="1560" y="583" font-family="Inter,Arial,sans-serif" font-size="17" fill="#16A34A" font-weight="650" text-anchor="start">Keep payment data safe</text><text x="1560" y="618" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Prefer hosted checkout / tokenization; do not store raw card data.</text><text x="1560" y="645" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Protect provider secrets; audit sensitive actions and ledger corrections.</text><path d="M2170 445 L2170 490 L410 490 L410 520" fill="none" stroke="#64748B" stroke-width="2.5" stroke-dasharray="8,6" marker-end="url(#arr)"/><rect x="28" y="805" width="2344" height="810" rx="24" fill="#FFFFFF" stroke="#B8D5F5" stroke-width="2"/><rect x="48" y="825" width="700" height="48" rx="12" fill="#E8F2FF" stroke="#D1E5FF"/><text x="68" y="858" font-family="Inter,Arial,sans-serif" font-size="24" fill="#164E9A" font-weight="750" text-anchor="start">2. PAYMENT INITIATION &amp; CALLBACK SEQUENCE</text><rect x="60" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="150" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Merchant</text><line x1="150" y1="952" x2="150" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="375" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="465" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Payment API</text><line x1="465" y1="952" x2="465" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="690" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="780" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Payment DB</text><line x1="780" y1="952" x2="780" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="1005" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="1095" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Provider Adapter</text><line x1="1095" y1="952" x2="1095" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="1320" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="1410" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Provider</text><line x1="1410" y1="952" x2="1410" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="1635" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="1725" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Webhook Handler</text><line x1="1725" y1="952" x2="1725" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><rect x="1950" y="900" width="180" height="52" rx="10" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="2"/><text x="2040" y="933" font-family="Inter,Arial,sans-serif" font-size="18" fill="#0F172A" font-weight="700" text-anchor="middle">Outbox / Order</text><line x1="2040" y1="952" x2="2040" y2="1400" stroke="#94A3B8" stroke-width="2" stroke-dasharray="7,7"/><line x1="150" y1="985" x2="465" y2="985" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="307.5" y="975" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">1. POST payment + idempotency key</text><line x1="465" y1="1030" x2="780" y2="1030" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="622.5" y="1020" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">2. Insert CREATED / PENDING record</text><line x1="780" y1="1075" x2="1095" y2="1075" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="937.5" y="1065" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">3. Call provider with stable reference</text><line x1="1095" y1="1120" x2="1410" y2="1120" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="1252.5" y="1110" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">4. Authorize / capture; timeout may be UNKNOWN</text><line x1="1410" y1="1165" x2="1725" y2="1165" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="1567.5" y="1155" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">5. Signed webhook → verify + dedupe event</text><line x1="1725" y1="1210" x2="780" y2="1210" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="1252.5" y="1200" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">6. Apply valid state + ledger entry / reversal</text><line x1="780" y1="1255" x2="2040" y2="1255" stroke="#2563EB" stroke-width="2.5" marker-end="url(#arr)"/><text x="1410.0" y="1245" font-family="Inter,Arial,sans-serif" font-size="15" fill="#1E40AF" font-weight="600" text-anchor="middle">7. Outbox publishes result for order update</text><rect x="65" y="1310" width="705" height="235" rx="18" fill="#FFF7ED" stroke="#EA580C" stroke-width="2"/><text x="85" y="1345" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Ambiguous timeout</text><text x="85" y="1373" font-family="Inter,Arial,sans-serif" font-size="17" fill="#EA580C" font-weight="650" text-anchor="start">Do not double-charge</text><text x="85" y="1408" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Keep state UNKNOWN / PENDING</text><text x="85" y="1435" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Query provider or wait for callback / reconcile</text><rect x="825" y="1310" width="705" height="235" rx="18" fill="#F5F3FF" stroke="#7C3AED" stroke-width="2"/><text x="845" y="1345" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Duplicate / stale callback</text><text x="845" y="1373" font-family="Inter,Arial,sans-serif" font-size="17" fill="#7C3AED" font-weight="650" text-anchor="start">Idempotent processing</text><text x="845" y="1408" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Unique provider event ID</text><text x="845" y="1435" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Reject invalid state transitions</text><rect x="1585" y="1310" width="745" height="235" rx="18" fill="#F0FDF4" stroke="#16A34A" stroke-width="2"/><text x="1605" y="1345" font-family="Inter,Arial,sans-serif" font-size="23" fill="#102849" font-weight="750" text-anchor="start">Refund &amp; reconciliation</text><text x="1605" y="1373" font-family="Inter,Arial,sans-serif" font-size="17" fill="#16A34A" font-weight="650" text-anchor="start">Auditable recovery</text><text x="1605" y="1408" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Record refund request and outcome</text><text x="1605" y="1435" font-family="Inter,Arial,sans-serif" font-size="18" fill="#334155" font-weight="450" text-anchor="start">Compare with settlement report; investigate mismatches</text><text x="1200.0" y="1590" font-family="Inter,Arial,sans-serif" font-size="17" fill="#64748B" font-weight="600" text-anchor="middle">Core principle: never infer failure from a timeout; use idempotency, durable state, verified callbacks and reconciliation.</text></svg>