<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1240" viewBox="0 0 1800 1240" role="img" aria-labelledby="svgTitle svgDesc">
<title id="svgTitle">Ad Impression Tracking System — Optional AI/ML Fraud Detection</title><desc id="svgDesc">Optional downstream extension for feature generation, model scoring, risk policy evaluation, filtered reporting and monitoring. Core event ingestion and raw archival continue independently of model availability.</desc>
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/></marker>
  <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L10,5 L0,10 z" fill="#64748B"/></marker>
  <style>
    text { font-family: Inter, Arial, Helvetica, sans-serif; fill: #172033; }
    .main-title { font-size: 36px; font-weight: 750; fill: #102849; letter-spacing: .2px; }
    .subtitle { font-size: 17px; fill: #64748B; }
    .section-title { font-size: 19px; font-weight: 700; fill: #102849; }
    .card-title { font-size: 17px; font-weight: 700; }
    .body { font-size: 14px; }
    .small { font-size: 12px; }
    .tiny { font-size: 11px; }
    .muted { fill: #64748B; }
    .label { font-size: 12px; font-weight: 700; fill: #2563EB; }
    .flow { fill: none; stroke: #2563EB; stroke-width: 2.1; marker-end: url(#arrow); }
    .flow-gray { fill: none; stroke: #64748B; stroke-width: 1.8; marker-end: url(#arrowGray); }
    .dash { stroke-dasharray: 6 5; }
  </style>
</defs>
<rect width="100%" height="100%" fill="#FFFFFF"/>
<text x="60" y="62" class="main-title">DESIGN AN AD IMPRESSION TRACKING SYSTEM</text><text x="60" y="96" class="subtitle">03  /  OPTIONAL AI/ML FRAUD-DETECTION EXTENSION</text><rect x="55" y="120" width="1690" height="70" rx="12" fill="#FFFBEB" stroke="#B45309" stroke-width="1.4"/><text x="78" y="149" class="card-title" style="fill:#B45309">OPTIONAL EXTENSION — NOT A BLOCKING DEPENDENCY</text><text x="78" y="174" class="body">Preserve raw events and keep the core ingestion path available even if model scoring is slow or unavailable.</text><rect x="55" y="215" width="1690" height="34" rx="10" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.1"/><text x="69" y="238" class="section-title">A. Online risk-scoring path</text><rect x="65" y="275" width="235" height="190" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/><circle cx="96" cy="307" r="15" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="96" y="312" class="body" style="fill:#2563EB" text-anchor="middle">01</text><text x="121" y="304" class="card-title" style="fill:#2563EB">Enriched Events</text><text x="83" y="332" class="body">• Stream processor output</text><text x="83" y="354" class="body">• Event ID + campaign context</text><text x="83" y="376" class="body">• Raw event remains preserved</text><rect x="330" y="275" width="245" height="190" rx="14" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.6"/><circle cx="361" cy="307" r="15" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/><text x="361" y="312" class="body" style="fill:#6D28D9" text-anchor="middle">02</text><text x="386" y="304" class="card-title" style="fill:#6D28D9">Feature Generation</text><text x="348" y="332" class="body">• Rate / frequency signals</text><text x="348" y="354" class="body">• Publisher and campaign features</text><text x="348" y="376" class="body">• Aggregate behavior windows</text><rect x="605" y="275" width="235" height="190" rx="14" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.6"/><circle cx="636" cy="307" r="15" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/><text x="636" y="312" class="body" style="fill:#0F766E" text-anchor="middle">03</text><text x="661" y="304" class="card-title" style="fill:#0F766E">Online Feature Store</text><text x="623" y="332" class="body">• Recent feature values</text><text x="623" y="354" class="body">• Low-latency lookups</text><text x="623" y="376" class="body">• Versioned feature definitions</text><rect x="870" y="275" width="240" height="190" rx="14" fill="#ECFDF5" stroke="#047857" stroke-width="1.6"/><circle cx="901" cy="307" r="15" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/><text x="901" y="312" class="body" style="fill:#047857" text-anchor="middle">04</text><text x="926" y="304" class="card-title" style="fill:#047857">Fraud Scoring Service</text><text x="888" y="332" class="body">• Model inference</text><text x="888" y="354" class="body">• Risk score + reason codes</text><text x="888" y="376" class="body">• Model / threshold version</text><rect x="1140" y="275" width="245" height="190" rx="14" fill="#FFFBEB" stroke="#B45309" stroke-width="1.6"/><circle cx="1171" cy="307" r="15" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="1171" y="312" class="body" style="fill:#B45309" text-anchor="middle">05</text><text x="1196" y="304" class="card-title" style="fill:#B45309">Policy Evaluation</text><text x="1158" y="332" class="body">• Rules + risk thresholds</text><text x="1158" y="354" class="body">• Allow / review / filter</text><text x="1158" y="376" class="body">• Auditable decision record</text><rect x="1415" y="275" width="300" height="190" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/><circle cx="1446" cy="307" r="15" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="1446" y="312" class="body" style="fill:#2563EB" text-anchor="middle">06</text><text x="1471" y="304" class="card-title" style="fill:#2563EB">Reporting Outcomes</text><text x="1433" y="332" class="body">• Raw counts remain available</text><text x="1433" y="354" class="body">• Filtered / accepted views</text><text x="1433" y="376" class="body">• Review and investigation queue</text><path d="M303,370.0 L325,370.0" class="flow"/><path d="M578,370.0 L600,370.0" class="flow"/><path d="M843,370.0 L865,370.0" class="flow"/><path d="M1113,370.0 L1135,370.0" class="flow"/><path d="M1388,370.0 L1410,370.0" class="flow"/><rect x="90" y="500" width="520" height="92" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="112" y="532" class="card-title" style="fill:#102849">Decision outputs</text><text x="112" y="558" class="small">Allowed → normal reporting     •     Review → hold / inspect</text><text x="112" y="579" class="small">Filtered → exclude only from the defined filtered metric</text><path d="M1515,465 L1515,490" class="flow-gray dash"/><text x="1530" y="486" class="small" style="fill:#64748B">audit trail</text><rect x="55" y="625" width="1690" height="34" rx="10" fill="#F5F3FF" stroke="#DDD6FE" stroke-width="1.1"/><text x="69" y="648" class="section-title">B. Offline training, evaluation and model lifecycle</text><rect x="75" y="690" width="300" height="185" rx="14" fill="#EFF6FF" stroke="#2563EB" stroke-width="1.6"/><circle cx="106" cy="722" r="15" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="106" y="727" class="body" style="fill:#2563EB" text-anchor="middle">A</text><text x="131" y="719" class="card-title" style="fill:#2563EB">Historical Data + Labels</text><text x="93" y="747" class="body">• Retained raw event archive</text><text x="93" y="769" class="body">• Adjudicated invalid-traffic labels</text><text x="93" y="791" class="body">• Privacy-controlled training data</text><rect x="420" y="690" width="300" height="185" rx="14" fill="#F5F3FF" stroke="#6D28D9" stroke-width="1.6"/><circle cx="451" cy="722" r="15" fill="#FFFFFF" stroke="#6D28D9" stroke-width="1.5"/><text x="451" y="727" class="body" style="fill:#6D28D9" text-anchor="middle">B</text><text x="476" y="719" class="card-title" style="fill:#6D28D9">Feature / Training Pipeline</text><text x="438" y="747" class="body">• Build training examples</text><text x="438" y="769" class="body">• Prevent target leakage</text><text x="438" y="791" class="body">• Validate quality and drift</text><rect x="765" y="690" width="300" height="185" rx="14" fill="#ECFDF5" stroke="#047857" stroke-width="1.6"/><circle cx="796" cy="722" r="15" fill="#FFFFFF" stroke="#047857" stroke-width="1.5"/><text x="796" y="727" class="body" style="fill:#047857" text-anchor="middle">C</text><text x="821" y="719" class="card-title" style="fill:#047857">Model Registry + Evaluation</text><text x="783" y="747" class="body">• Version model artifacts</text><text x="783" y="769" class="body">• Offline precision / recall checks</text><text x="783" y="791" class="body">• Threshold and rollback metadata</text><rect x="1110" y="690" width="290" height="185" rx="14" fill="#F0FDFA" stroke="#0F766E" stroke-width="1.6"/><circle cx="1141" cy="722" r="15" fill="#FFFFFF" stroke="#0F766E" stroke-width="1.5"/><text x="1141" y="727" class="body" style="fill:#0F766E" text-anchor="middle">D</text><text x="1166" y="719" class="card-title" style="fill:#0F766E">Controlled Deployment</text><text x="1128" y="747" class="body">• Shadow / canary rollout</text><text x="1128" y="769" class="body">• Compare with rules baseline</text><text x="1128" y="791" class="body">• Roll back unsafe versions</text><rect x="1445" y="690" width="270" height="185" rx="14" fill="#FFFBEB" stroke="#B45309" stroke-width="1.6"/><circle cx="1476" cy="722" r="15" fill="#FFFFFF" stroke="#B45309" stroke-width="1.5"/><text x="1476" y="727" class="body" style="fill:#B45309" text-anchor="middle">E</text><text x="1501" y="719" class="card-title" style="fill:#B45309">Model Monitoring</text><text x="1463" y="747" class="body">• Score distribution / drift</text><text x="1463" y="769" class="body">• False-positive review</text><text x="1463" y="791" class="body">• Latency and availability</text><path d="M375,780 L415,780" class="flow"/><path d="M720,780 L760,780" class="flow"/><path d="M1065,780 L1105,780" class="flow"/><path d="M1400,780 L1440,780" class="flow"/><path d="M900,690 H945.0 V475 H990" class="flow-gray dash"/><text x="1035" y="580" class="small" style="fill:#64748B" text-anchor="middle">versioned model</text><rect x="55" y="915" width="1690" height="34" rx="10" fill="#F0FDFA" stroke="#99F6E4" stroke-width="1.1"/><text x="69" y="938" class="section-title">C. Production safeguards</text><rect x="70" y="970" width="300" height="145" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="84" y="1000" class="card-title" style="fill:#2563EB">Never discard raw data</text><text x="84" y="1028" class="small">Keep raw events for audit</text><text x="84" y="1047" class="small">and recomputation.</text><rect x="410" y="970" width="300" height="145" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="424" y="1000" class="card-title" style="fill:#047857">Fail safely</text><text x="424" y="1028" class="small">If scoring is down, follow</text><text x="424" y="1047" class="small">a documented fallback</text><text x="424" y="1066" class="small">policy.</text><rect x="750" y="970" width="300" height="145" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="764" y="1000" class="card-title" style="fill:#6D28D9">Separate metric definitions</text><text x="764" y="1028" class="small">Raw, valid and</text><text x="764" y="1047" class="small">fraud-filtered totals are</text><text x="764" y="1066" class="small">distinct.</text><rect x="1090" y="970" width="300" height="145" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="1104" y="1000" class="card-title" style="fill:#B45309">Audit decisions</text><text x="1104" y="1028" class="small">Record model version, risk</text><text x="1104" y="1047" class="small">score and policy outcome.</text><rect x="1430" y="970" width="300" height="145" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.2"/><text x="1444" y="1000" class="card-title" style="fill:#0F766E">Measure real quality</text><text x="1444" y="1028" class="small">Monitor drift, false</text><text x="1444" y="1047" class="small">positives and reviewer</text><text x="1444" y="1066" class="small">outcomes.</text><text x="60" y="1185" class="small" style="fill:#64748B">AI/ML is a downstream enhancement; core ingestion, durable capture and baseline aggregation do not depend on model availability.</text><text x="60" y="1210" class="small" style="fill:#64748B">Model outputs require validation, monitoring, auditability and documented policy before affecting reported metrics.</text></svg>