<!DOCTYPE html>
<html lang="en" class="scroll-smooth dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>45-Day Interview Prep OS — Senior Engineering Interview Workspace</title>
  <meta name="description" content="A practical interview-prep system that helps working software engineers organize DSA, System Design, revision, and daily preparation in one structured workspace." />
  
  <!-- Open Graph -->
  <meta property="og:title" content="45-Day Interview Prep OS" />
  <meta property="og:description" content="Prepare for Senior-Level Interviews in 45 Days — Without Burning Out." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/logo.svg" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/logo.svg" />
  
  <!-- Google Fonts: Geist, JetBrains Mono, Material Symbols Outlined -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  
  <!-- Stylesheets -->
  <link rel="stylesheet" href="/src/styles/variables.css" />
  <link rel="stylesheet" href="/src/styles/base.css" />
  <link rel="stylesheet" href="/src/styles/components.css" />
  <link rel="stylesheet" href="/src/styles/dashboard.css" />

  <!-- Tailwind CDN with Stitch Midnight Velocity Design System Tokens -->
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "background": "#0B0F19",
            "surface": "#0F172A",
            "surface-card": "#151D2F",
            "surface-card-hover": "#1E293B",
            "surface-container": "#111827",
            "surface-container-low": "#0D1322",
            "brand-indigo": "#6366F1",
            "brand-indigo-hover": "#4F46E5",
            "brand-cyan": "#38BDF8",
            "brand-emerald": "#10B981",
            "outline-border": "rgba(255, 255, 255, 0.08)",
            "outline-border-subtle": "rgba(255, 255, 255, 0.05)",
            "text-primary": "#FFFFFF",
            "text-muted": "#94A3B8",
            "text-subtle": "#64748B",
            "canvas-dark": "#0A0E17",
            "canvas-subtle": "#0F1626",
            "card-surface": "#141C2E",
            "card-surface-elevated": "#182238",
            "card-border": "#24314A",
            "card-border-subtle": "#1B2538",
            "text-secondary": "#94A3B8",
            "status-emerald": "#10B981",
            "status-amber": "#F59E0B",
            "status-slate": "#64748B"
          },
          borderRadius: {
            DEFAULT: "0.25rem",
            sm: "0.125rem",
            md: "0.25rem",
            lg: "0.375rem",
            xl: "0.5rem",
            full: "9999px"
          },
          fontFamily: {
            sans: ["Geist", "sans-serif"],
            headline: ["Geist", "sans-serif"],
            body: ["Geist", "sans-serif"],
            code: ["JetBrains Mono", "monospace"]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-[#0B0F19] font-body text-[#CBD5E1] antialiased selection:bg-[#6366F1] selection:text-white min-h-screen relative text-[14px]">
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
