<!DOCTYPE html>
<html lang="en" class="scroll-smooth light" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>45-Day Interview Prep OS — Senior Engineering Interview Workspace</title>
  <meta name="description" content="A practical interview-prep system that helps working software engineers organize DSA, System Design, revision, and daily preparation in one structured workspace." />
  
  <!-- Zero-FOUC Theme Initializer: Defaults to Light Mode -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('prep_os_theme') || 'light';
        if (saved === 'dark') {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
          document.documentElement.setAttribute('data-theme', 'dark');
        } else {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) {
        document.documentElement.classList.add('light');
      }
    })();
  </script>

  <!-- Open Graph -->
  <meta property="og:title" content="45-Day Interview Prep OS" />
  <meta property="og:description" content="Prepare for Senior-Level Interviews in 45 Days — Without Burning Out." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/logo.svg" />
  
  <!-- Favicon -->
